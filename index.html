  {t:'Sets & Venn diagrams',pts:['Set notation: n(A)=number of elements, A′=complement, U=universal set','A∪B = union (everything in A or B or both)','A∩B = intersection (only elements in BOTH)','Describe sets: A={x|x is a natural number}','[Extended] Venn diagrams with up to 3 sets','[Extended] ∈ (is element of), ∉ (is not element of)','[Extended] ∅ = empty set; ⊆ = subset; ⊈ = not a subset']},
  {t:'Indices and roots',pts:['Recall squares 1²–15² and their square roots','Recall cubes of 1,2,3,4,5,10 and their cube roots','Zero index: a⁰=1 for any a≠0','Negative index: a⁻ⁿ=1/aⁿ e.g. 7⁻²=1/49','Multiply same base: aᵐ×aⁿ=aᵐ⁺ⁿ','Divide same base: aᵐ÷aⁿ=aᵐ⁻ⁿ','Power of power: (aᵐ)ⁿ=aᵐⁿ','[Extended] Fractional indices: a^(1/2)=√a, a^(1/3)=∛a','[Extended] a^(m/n)=(ⁿ√a)ᵐ — evaluate e.g. 8^(2/3)=4, 81^(1/2)=9']},
  {t:'Standard form',pts:['Write as A×10ⁿ where 1≤A<10 and n is an integer','Positive n = large number; negative n = small number (e.g. 4.5×10⁻⁵=0.000045)','Multiply in standard form: multiply A-values, ADD powers','Divide in standard form: divide A-values, SUBTRACT powers','Add/subtract: make powers equal first, then add A-values','After calculation always check 1≤A<10, adjust if not','[Extended] Perform all operations without a calculator']},
  {t:'Estimation and accuracy',pts:['Round to given decimal places (d.p.)','Round to given significant figures (s.f.) — count from first non-zero digit','Estimate: round each number to 1 s.f., then calculate','Non-exact answers: give to at least 3 s.f. unless told otherwise','Exact answers: leave in terms of π or as surd when asked','Never round intermediate values — only round the final answer']},
  {t:'Ratio and proportion',pts:['Simplify ratios by dividing all parts by HCF e.g. 20:30:40 → 2:3:4','Divide a quantity in ratio: find total shares, then multiply','Proportional reasoning: find unit rate first then scale up','Map scales: 1:50000 means 1cm on map = 500m real life','Best value: find cost per unit for comparison']},
  {t:'Rates and speed',pts:['Speed = Distance ÷ Time — MUST be memorised (not given!)','Distance = Speed × Time; Time = Distance ÷ Speed','Average speed = total distance ÷ total time','Notation: m/s, km/h, g/cm³, litres/min','Exchange rates, hourly pay, fuel consumption, flow rates']},
  {t:'Percentages',pts:['% of quantity: (percentage÷100)×quantity','Express as %: (part÷whole)×100','% increase multiplier: 1+(r/100); % decrease: 1−(r/100)','Simple interest: I=PRT/100 — NOT given in exam, memorise','Compound interest: A=P(1+r/100)ⁿ — NOT given, MUST memorise','Profit and loss as amounts and percentages','[Extended] Reverse percentage: original = final ÷ multiplier','[Extended] Repeated percentage change over multiple periods']},
  {t:'Time and money',pts:['60 seconds=1 min; 60 min=1 hour; 24 hours=1 day; 1 year=365 days','24-hour clock: 3:15am=0315; 3:15pm=1515','Read and use timetables; calculate journey times','Time zone differences; local times','Calculate with money; convert between currencies using exchange rates']},
  {t:'Calculator skills',pts:['NEVER round mid-calculation — use ANS key or store in memory','Use brackets to keep order of operations correct','Enter time as decimal: 2h30min = 2.5 hours','Interpret display: 4.8 in money context = $4.80','Use π button (not 3.14) for accuracy; only round final answer']},
  {t:'[Extended] Surds',pts:['Surd = irrational root that cannot simplify to rational','Simplify: find largest perfect square factor e.g. √72=√(36×2)=6√2','Add/subtract surds: must have same radicand e.g. 3√5+2√5=5√5','Multiply surds: √a×√b=√(ab); (√a)²=a','Expand brackets with surds using FOIL','Rationalise denominator (simple): multiply by surd/surd e.g. 10/√5 × √5/√5 = 2√5','Rationalise denominator (conjugate): multiply by (a+√b)/(a+√b) when denominator is (a−√b)','Key result: (a+√b)(a−√b)=a²−b (always rational)']},
  {t:'[Extended] Exponential growth and decay',pts:['Model: y=a×bˣ where b>1 (growth) or 0<b<1 (decay)','Compound interest IS exponential growth: A=P(1+r/100)ⁿ','Depreciation IS exponential decay: A=P(1−r/100)ⁿ','Population, radioactive decay, medicine dosage — all exponential models','Knowledge of the number e is NOT required for this syllabus']},
]},
{id:'alg',name:'Algebra',icon:'sparkle',subs:[
  {t:'Expanding brackets',pts:['Single bracket: multiply term outside by each term inside','Double brackets (Core): (2x+1)(x−4) — use FOIL or grid method','[Extended] Double brackets with 2 variables: (3x+y)(x−4y)','[Extended] Perfect square: (a+b)²=a²+2ab+b² — the MIDDLE term is the most forgotten!','[Extended] (a−b)²=a²−2ab+b²','[Extended] Difference of squares: (a+b)(a−b)=a²−b²','[Extended] Three brackets: expand any two first, then expand the result by the third']},
  {t:'Factorising',pts:['Common factor: take out the HCF of all terms — always factorise FULLY','Check: expand your answer to verify it\'s correct','[Extended] Grouping (4 terms): ax+bx+kay+kby = x(a+b)+ky(a+b) = (x+ky)(a+b)','[Extended] Difference of two squares: a²x²−b²y² = (ax+by)(ax−by)','[Extended] Perfect square: a²+2ab+b²=(a+b)²','[Extended] Quadratic ax²+bx+c: find two numbers multiplying to ac and adding to b','[Extended] Cubic ax³+bx²+cx = x(ax²+bx+c): factor x then factorise quadratic']},
  {t:'Algebraic fractions',pts:['[Core] Simplify in one step only: x²/x=x, 3/(6x)=1/(2x)','[Extended] Add fractions: find common denominator first','[Extended] Subtract, multiply, divide algebraic fractions','[Extended] Factorise top and bottom fully then cancel common factors','[Extended] Example: (x²−2x)/(x²−5x+6) = x(x−2)/((x−2)(x−3)) = x/(x−3)']},
  {t:'Index laws in algebra',pts:['Apply same rules as number indices to algebraic terms','Simplify: x³×x⁴=x⁷; x⁵÷x²=x³; (x²)³=x⁶; x⁰=1','Negative: x⁻²=1/x²; simplify 12a⁵÷3a⁻²=4a⁷','Mixed: 6x⁷y⁴×5x⁻⁵y=30x²y⁵','Solve simple index equations: 2ˣ=32 → x=5','[Extended] Fractional indices in algebra expressions','[Extended] Solve harder: 32ˣ=2 → (2⁵)ˣ=2¹ → 5x=1 → x=1/5']},
  {t:'Linear equations',pts:['Solve by inverse operations — what\'s done to x, undo in reverse','Example: 5−2x=3(x+7) → expand → collect x terms → solve','Simultaneous equations — elimination: make coefficients equal then add/subtract','Simultaneous equations — substitution: express one variable, substitute into other','Always check answer by substituting back into BOTH original equations']},
  {t:'[Extended] Quadratic equations',pts:['Method 1 — Factorisation: set each bracket=0','Method 2 — GDC: graph y=ax²+bx+c, find x-intercepts','Method 3 — Quadratic formula: x=(−b±√(b²−4ac))/2a — GIVEN in exam but know when to use','Discriminant b²−4ac: >0 gives 2 solutions, =0 gives 1, <0 gives none','Answers in surd form e.g. x=(3±√5)/2','Construct quadratic from context (area, geometry problems)']},
  {t:'[Extended] Fractional equations',pts:['Clear denominators: multiply every term by the LCM of all denominators','Equations like: x/(2x+1)=4 → multiply both sides by (2x+1)','Equations with two denominators: find LCM then expand and solve','Always check answers — some may make original denominator=0 (reject those)']},
  {t:'Changing the subject',pts:['[Core] Subject appears once, no powers/roots of subject','Example: v=u+at → subtract u → divide by a → t=(v−u)/a','[Extended] Subject appears twice: group terms, factorise out the subject','Example: ax+b=cx+d → ax−cx=d−b → x(a−c)=d−b → x=(d−b)/(a−c)','[Extended] Subject under square root: square both sides','Example: T=2π√(L/g) → T²=4π²(L/g) → L=gT²/(4π²)']},
  {t:'Inequalities',pts:['[Core] Represent on number line: ○ for strict (<,>), ● for (≤,≥)','[Extended] Solve like equations — but FLIP the inequality sign when multiplying or dividing by a NEGATIVE number','[Extended] Example: −2x<6 → x>−3 (sign flipped because dividing by −2)','[Extended] Graph in 2 variables: dashed line for strict, solid for ≤≥','[Extended] Shade UNWANTED region (standard convention)','[Extended] List the inequalities that define a given shaded region']},
  {t:'Sequences',pts:['Term-to-term rule: describe how each term is found from the previous','Recognise: square (1,4,9,16…), cube (1,8,27,64…), triangle (1,3,6,10…)','Linear nth term: T(n)=an+b where a=common difference','Quadratic nth term: T(n)=an²+bn+c where 2nd differences are constant=2a','Cubic nth term: 3rd differences constant','[Extended] Exponential sequence: multiply by fixed ratio each time','[Extended] Difference method: keep taking differences until you get a constant row']},
  {t:'[Extended] Proportion',pts:['Direct proportion y∝x means y=kx; find k from given values, then use it','y∝x² means y=kx²; y∝√x means y=k√x; y∝x³ means y=kx³','Inverse proportion y∝1/x means y=k/x (as x doubles, y halves)','y∝1/x² means y=k/x² (inverse square law)','Method: (1) write formula (2) substitute known pair to find k (3) use k to answer','Identify best model: plot y vs x², y vs 1/x etc. and see which is linear','Symbol ∝ means "is proportional to" — must be known']},
]},
{id:'func',name:'Functions',icon:'f(x)',subs:[
  {t:'Recognising graph shapes',pts:['Linear f(x)=ax+b: straight line, gradient a, y-intercept b','Quadratic f(x)=ax²+bx+c: parabola, U-shape if a>0, ∩-shape if a<0','[Extended] Cubic f(x)=ax³+…: S-shaped curve, up to 2 turning points','[Extended] Reciprocal f(x)=a/x: two-branch hyperbola, asymptotes at both axes','[Extended] Exponential growth f(x)=aˣ (a>1): steep rise, always above x-axis','[Extended] Exponential decay f(x)=aˣ (0<a<1): falling curve approaching x-axis','[Extended] Sine f(x)=a sin(bx): wave, amplitude=|a|, period=360°/b','[Extended] Cosine f(x)=a cos(bx): same as sine but starts at maximum','[Extended] Tangent f(x)=tan x: periodic with vertical asymptotes at 90°,270°…','Determine values of a,b,c,d from graph features (intercepts, turning points, period)']},
  {t:'GDC graph skills',pts:['Sketch any function — choose window showing key features','Produce a table of values for a function','Plot individual points','Find zeros/roots (x-intercepts): menu → Analyze Graph → Zero','Find local maximum: menu → Analyze Graph → Maximum','Find local minimum: menu → Analyze Graph → Minimum','Find intersection of two graphs: menu → Analyze Graph → Intersection','Find vertex of a quadratic: use maximum/minimum function','GDC can handle unfamiliar functions not explicitly in the syllabus']},
  {t:'Function notation and basics',pts:['f(x) notation: f(x)=3x−5 means the rule is 3x−5','Evaluate: if f(x)=2x²+3, find f(4) = 2(16)+3 = 35','[Extended] Domain = allowed input values','[Extended] Range = set of output values','Functions may use f, g, h or any letter']},
  {t:'[Extended] Inverse and composite functions',pts:['Inverse f⁻¹(x) REVERSES the function: if f maps 3→7, then f⁻¹ maps 7→3','Find f⁻¹(x): write y=f(x), SWAP x and y, rearrange for y, write as f⁻¹(x)','Check: f(f⁻¹(x))=x always','Composite gf(x)=g(f(x)): apply f FIRST then g to the result','ORDER MATTERS: gf ≠ fg in general','NOT required to find domain/range of composite functions']},
  {t:'[Extended] Quadratic functions in special forms',pts:['Vertex form: y=a(x−h)²+k has vertex at (h,k)','Given vertex (h,k) and another point: substitute to find a, then write full equation','Given x-intercepts x₁,x₂ and another point: y=a(x−x₁)(x−x₂), substitute to find a','When a=1 with vertex given: y=(x−h)²+k directly']},
  {t:'[Extended] Asymptotes and transformations',pts:['Asymptote: line curve approaches but never reaches','Reciprocal 1/x: vertical asymptote x=0, horizontal asymptote y=0','Exponential aˣ: horizontal asymptote at y=0','tan x: vertical asymptotes at x=90°,270°,450°…','y=f(x)+k: shifts graph UPWARD by k (down if k negative)','y=f(x+k): shifts graph LEFT by k (right if k negative) — counterintuitive!','k must be integer; describe as "translation by vector (0,k) or (−k,0)"']},
  {t:'[Extended] Logarithms',pts:['Log is inverse of exponential: y=aˣ ⟺ x=log_a(y)','log without base means log₁₀ (base 10)','To solve aˣ=b: x = log(b)/log(a) (change of base)','Example: 3ˣ=20 → x=log(20)/log(3)≈2.73','Apply to compound interest: solve A=P(1+r/100)ⁿ for n','Solve log equations from graphs or algebraically']},
]},
{id:'cg',name:'Coordinate Geometry',icon:'ruler',subs:[
  {t:'Gradient, length and midpoint',pts:['Gradient m=(y₂−y₁)/(x₂−x₁) — rise divided by run','[Core] Gradient from a grid (count squares)','[Extended] Calculate gradient from coordinates of two points','Positive gradient: slopes upward left-to-right','Negative gradient: slopes downward left-to-right','Zero gradient: horizontal line; undefined gradient: vertical line','Length: d=√((x₂−x₁)²+(y₂−y₁)²) — Pythagoras between two points','Midpoint: M=((x₁+x₂)/2, (y₁+y₂)/2) — average of coordinates']},
  {t:'Equations of lines',pts:['y=mx+c: m is gradient, c is y-intercept (where it crosses y-axis)','To find equation: use y−y₁=m(x−x₁) then rearrange to y=mx+c','Vertical lines: x=k (have undefined gradient)','[Extended] Form ax+by=c: rearrange to y=mx+c to find gradient and y-intercept','Always give equation in fully simplified form','Find gradient from equation: rearrange to y=mx+c form, coefficient of x is gradient']},
  {t:'Parallel and perpendicular lines',pts:['Parallel lines have EQUAL gradients','Find parallel line equation: use same m, different c','[Extended] Perpendicular: gradients multiply to −1: m₂=−1/m₁','[Extended] Flip the fraction and change the sign to get perpendicular gradient','[Extended] Perpendicular bisector: passes through midpoint at right angles to segment']},
]},
{id:'geo',name:'Geometry',icon:'sparkle',subs:[
  {t:'Geometric vocabulary',pts:['Triangle types: equilateral (3 equal), isosceles (2 equal), scalene (all different), right-angled','Quadrilaterals: square, rectangle, rhombus, parallelogram, kite, trapezium','Polygons: pentagon(5), hexagon(6), octagon(8), decagon(10) — regular and irregular','Solids: cube, cuboid, prism, cylinder, pyramid, cone, sphere','[Extended] Also: tetrahedron, hemisphere, frustum','Circle: centre, radius, diameter, chord, tangent, arc, sector, segment, semicircle','[Extended] Major/minor arc and sector']},
  {t:'Bearings',pts:['Always 3-figure, measured clockwise from north: 000° to 360°','N=000°, NE=045°, E=090°, SE=135°, S=180°, SW=225°, W=270°, NW=315°','Back bearing: bearing from B back to A = bearing from A to B ± 180°','Example: A to B is 065°, so B to A is 065°+180°=245°']},
  {t:'Angle properties',pts:['Angles at a point sum to 360°','Angles on a straight line sum to 180°','Vertically opposite angles are EQUAL','Triangle angles sum to 180°; quadrilateral angles sum to 360°','Exterior angle of triangle = sum of the two non-adjacent interior angles','Corresponding angles equal (F-angles between parallel lines)','Alternate angles equal (Z-angles between parallel lines)','Co-interior angles sum to 180° (supplementary) — same side of transversal','Always state the theorem by name when giving reasons']},
  {t:'Polygons',pts:['Sum of interior angles = (n−2)×180°','Each interior angle of regular polygon = (n−2)×180°÷n','Each exterior angle of regular polygon = 360°÷n','Interior angle + exterior angle = 180°','Sum of all exterior angles of ANY polygon = 360°']},
  {t:'Symmetry',pts:['Line symmetry: shape looks same when folded along the mirror line','Rotational symmetry order: number of times shape looks same in one full 360° rotation','Square: 4 lines, order 4; rectangle: 2 lines, order 2','Equilateral triangle: 3 lines, order 3','Kite: 1 line, order 1; trapezium: 0 lines, order 1','[Extended] 3D: identify planes of symmetry and axes of rotational symmetry']},
  {t:'Similarity',pts:['Similar shapes: same shape, different size — all angles equal, sides in proportion','Scale factor k: corresponding lengths in ratio k','Areas of similar shapes in ratio k²','Volumes of similar solids in ratio k³','[Extended] Show triangles similar using: AA (two equal angles), SAS, or SSS ratios']},
  {t:'Circle theorems — Core',pts:['THEOREM 1: Angle in a semicircle = 90° (angle subtended by diameter at circumference)','THEOREM 2: Angle between tangent and radius = 90° at the point of contact','THEOREM 3: Tangents from an external point are equal in length','State theorem by exact name in exam answers!']},
  {t:'[Extended] Circle theorems',pts:['THEOREM 4: Angle at centre = 2 × angle at circumference (same arc)','THEOREM 5: Angles in the same segment (subtended by same arc) are equal','THEOREM 6: Opposite angles of a cyclic quadrilateral sum to 180°','THEOREM 7: Alternate segment theorem — angle between tangent and chord = angle in alternate segment','THEOREM 8: Equal chords are equidistant from the centre','THEOREM 9: Perpendicular from centre to chord bisects the chord','Always write the full theorem name as the reason in exam']},
]},
{id:'men',name:'Mensuration',icon:'cube',subs:[
  {t:'Units of measure',pts:['Length: 10mm=1cm, 100cm=1m, 1000m=1km','Area: 1cm²=100mm², 1m²=10000cm², 1km²=1000000m²','Volume: 1cm³=1000mm³, 1m³=1000000cm³','Capacity: 1 litre=1000ml=1000cm³; 1m³=1000 litres','Mass: 1000g=1kg; 1000kg=1 tonne (not needed usually)','Convert area: ×10000 to go from m² to cm²; ÷10000 to go back','Convert volume: ×1000000 from m³ to cm³; m³ to litres ×1000']},
  {t:'2D area and perimeter',pts:['Rectangle: Area=l×w; Perimeter=2(l+w) — NOT given, memorise','Triangle: Area=½×base×height — GIVEN in exam; height MUST be perpendicular','Parallelogram: Area=base×height — NOT given, memorise','Trapezium: Area=½(a+b)×h where a,b are parallel sides — NOT given, memorise','Compound shapes: split into known shapes, find each area, add (or subtract for cut-outs)']},
  {t:'Circles, arcs and sectors',pts:['Circumference: C=2πr — GIVEN in exam','Area of circle: A=πr² — GIVEN in exam','Arc length: (θ/360)×2πr — where θ is angle of sector','Sector area: (θ/360)×πr²','[Core] Sector angle must be a factor of 360° (e.g. 45°, 60°, 90°, 120°)','[Extended] Any sector angle works; recognise major (>180°) and minor (<180°) sectors','Exact answers: leave in terms of π e.g. 24π cm²','Use GDC value of π for decimal answers (not 3.14)']},
  {t:'3D: surface area and volume',pts:['GIVEN in exam: V=Al (prism); πr²h, 2πrh (cylinder); 4πr²/³πr³ (sphere); πrl, ⅓πr²h (cone); ⅓Ah (pyramid)','Cuboid: V=lwh; SA=2(lw+lh+wh) — NOT given, must know','Total cylinder SA = 2πrh + 2πr² (curved SA + two circles)','Cone slant height l=√(r²+h²) — use Pythagoras (NOT given!)','Total cone SA = πrl + πr² (curved SA + circular base)','[Extended] Frustum: subtract small cone from large cone']},
]},
{id:'trig',name:'Trigonometry',icon:'sin θ',subs:[
  {t:"Pythagoras' theorem",pts:["c²=a²+b² where c is hypotenuse (side opposite right angle)","To find hypotenuse: c=√(a²+b²)","To find shorter side: a=√(c²−b²)","Always identify which side is the hypotenuse FIRST","Apply to find chord length in a circle","Apply to find perpendicular distance from centre to chord","Apply to find distance between two coordinate points"]},
  {t:'Right-angled trigonometry',pts:['Label sides relative to angle θ: Hypotenuse (longest), Opposite (across from θ), Adjacent (next to θ)','SOH: sin θ = Opposite/Hypotenuse','CAH: cos θ = Adjacent/Hypotenuse','TOA: tan θ = Opposite/Adjacent','To find a side: rearrange the trig ratio','To find an angle: use inverse function sin⁻¹, cos⁻¹, or tan⁻¹','Answers in degrees to 1 decimal place','Always draw and label a diagram first','[Extended] Angles of elevation (looking up) and depression (looking down)','[Extended] Perpendicular distance from a point to a line = shortest distance']},
  {t:'[Extended] Exact trigonometric values',pts:['Derive from two triangles: 30-60-90 (halved equilateral) and 45-45-90 (isosceles right)','sin 0°=0, cos 0°=1, tan 0°=0','sin 30°=1/2, cos 30°=√3/2, tan 30°=1/√3=√3/3','sin 45°=1/√2=√2/2, cos 45°=1/√2=√2/2, tan 45°=1','sin 60°=√3/2, cos 60°=1/2, tan 60°=√3','sin 90°=1, cos 90°=0, tan 90°=undefined','These appear in non-calculator papers — MUST be memorised']},
  {t:'[Extended] Trig graphs and equations',pts:['y=sin x: starts 0, peaks at 90°, back to 0 at 180°, dips at 270°, back to 0 at 360°','y=cos x: starts at 1, reaches 0 at 90°, −1 at 180°, 0 at 270°, 1 at 360°','y=tan x: undefined at 90° and 270° (vertical asymptotes)','a sin(bx): amplitude=|a|, period=360°/b','Solve sin x=k: 1st solution=sin⁻¹(k), 2nd=180°−1st solution','Solve cos x=k: 1st solution=cos⁻¹(k), 2nd=360°−1st solution','Solve tan x=k: 1st solution=tan⁻¹(k), 2nd=1st+180°','Always find ALL solutions in the given range']},
  {t:'[Extended] Sine and cosine rules',pts:['Sine rule: a/sinA=b/sinB=c/sinC — GIVEN; use when angle + opposite side given (AAS/ASA)','Cosine rule: a²=b²+c²−2bc cosA — GIVEN; use for SAS or SSS (all 3 sides)','Area of any triangle = ½ab sinC — GIVEN; use when 2 sides + included angle known','Ambiguous case (SSA): may be two valid triangles — always check 180°−solution too','[Extended] Pythagoras and trig in 3D problems','[Extended] Angle between a line and a plane in 3D']},
]},
{id:'tv',name:'Transformations & Vectors',icon:'sparkle',subs:[
  {t:'Four transformations — Core',pts:['REFLECTION: state the mirror line equation (e.g. "reflection in y=x")','[Core] Reflect in vertical lines (x=k) or horizontal lines (y=k) only','ROTATION: state centre, angle, and direction (clockwise or anticlockwise)','[Core] Rotation about origin, vertices, or edge midpoints through multiples of 90°','ENLARGEMENT: state centre and scale factor','[Core] Positive and fractional scale factors only (SF>1 enlarges, 0<SF<1 shrinks)','TRANSLATION: state the column vector exactly','Positive x-component → right; positive y-component → up','[Core] NO combinations of transformations']},
  {t:'[Extended] Advanced transformations',pts:['Reflection in ANY straight line (not just horizontal/vertical)','Rotation about ANY centre, not just the origin','Enlargement with NEGATIVE scale factors: image on opposite side of centre, also flipped','SF=−1 is equivalent to 180° rotation about the centre','Combinations: apply transformations one after another','Reverse transformations: describe what maps the image back to the original']},
  {t:'[Extended] Vectors',pts:['Vector = quantity with both magnitude (size) and direction','Written as column vector (x above y), AB with arrow, or bold a','Add vectors: add x-components, add y-components separately','Subtract: a−b=a+(−b): reverse b then add','Scalar multiply: 3a triples the length, same direction; −a reverses direction','Triangle law: AB+BC=AC (following arrows around a path gives resultant)','To navigate: follow arrows in direction of arrow, OR negate if going against arrow','Parallel vectors: b=ka for some non-zero scalar k']},
  {t:'[Extended] Magnitude of vectors',pts:['Magnitude |a|=√(x²+y²) for column vector (x,y) — always a positive number','Magnitude is a LENGTH — it is always ≥ 0','|AB| = distance between points A and B','Unit vector: vector with magnitude 1; û=a/|a|']},
]},
{id:'prob',name:'Probability',icon:'sparkle',subs:[
  {t:'Probability basics',pts:['Probability is always between 0 (impossible) and 1 (certain)','P(A) = favourable outcomes ÷ total equally likely outcomes','P(not A) = 1 − P(A) — complementary events always sum to 1','Give probabilities as fractions, decimals or percentages','[Extended] Use formal notation P(A), P(A′), P(A∩B), P(A∪B)']},
  {t:'Relative and expected frequencies',pts:['Relative frequency = number of occurrences ÷ total number of trials','Relative frequency estimates probability — more trials = better estimate','Expected frequency = probability × number of trials','Fair: all outcomes equally likely; Biased: some outcomes more likely; Random: each selection has equal chance']},
  {t:'Sample space diagrams',pts:['List ALL possible outcomes systematically in a table or grid','Two dice: 6×6=36 outcomes total','P(event) = count of favourable outcomes ÷ total outcomes in sample space','Useful for two simultaneous events (two coins, dice, spinners)']},
  {t:'Venn diagrams',pts:['[Core] Venn diagrams with 2 sets','[Extended] Venn diagrams with up to 3 sets','Overlap region = A∩B (elements in BOTH A and B)','Union A∪B = everything in either circle (left + overlap + right)','Outside both circles = neither A nor B','All probabilities in a Venn diagram must sum to 1','[Extended] P(A∩B) = probability of both; P(A∪B) = probability of at least one']},
  {t:'Tree diagrams',pts:['Branches show outcomes; probabilities written beside branches','Probabilities from same point MUST sum to 1','Multiply along branches to get probability of combined outcome','Add end probabilities for different ways of getting same result','[Core] With replacement only (probabilities stay the same each draw)','[Extended] Without replacement: denominator decreases; adjust probabilities after each draw','[Extended] P(A or B) = P(A)+P(B) for mutually exclusive events (cannot both happen)','[Extended] P(A and B) = P(A)×P(B) for independent events (one doesn\'t affect other)']},
]},
{id:'stat',name:'Statistics',icon:'bars',subs:[

const NOTES=[
{id:'nn',name:'Number',clr:'#1e3a5f',sub:'Indices, standard form, surds, compound interest',concepts:[
{t:'Index Laws — Every Rule You Need',b:`<div class="wht">All six index rules work for any base — numbers or letters. Master these once and they apply everywhere.</div>
<table class="kt"><tr><th>Rule</th><th>Formula</th><th>Example</th></tr>
<tr><td>Multiply (same base)</td><td><code>aᵐ×aⁿ=aᵐ⁺ⁿ</code></td><td>x³×x⁴=x⁷</td></tr>
<tr><td>Divide (same base)</td><td><code>aᵐ÷aⁿ=aᵐ⁻ⁿ</code></td><td>x⁵÷x²=x³</td></tr>
<tr><td>Power of power</td><td><code>(aᵐ)ⁿ=aᵐⁿ</code></td><td>(x²)⁴=x⁸</td></tr>
<tr><td>Zero power</td><td><code>a⁰=1</code></td><td>7⁰=1, (xy)⁰=1</td></tr>
<tr><td>Negative power</td><td><code>a⁻ⁿ=1/aⁿ</code></td><td>2⁻³=1/8</td></tr>
<tr><td>Fraction power (root)</td><td><code>a^(1/n)=ⁿ√a</code></td><td>8^(1/3)=2</td></tr>
<tr><td>Fraction power (root+power)</td><td><code>a^(m/n)=(ⁿ√a)ᵐ</code></td><td>8^(2/3)=(∛8)²=4</td></tr></table>
<div class="tip"><div class="tip-i"></div><div class="tip-t"><strong>Fraction power trick:</strong> bottom of fraction = type of root, top = power. So 27^(2/3) = cube root of 27, then square it = 3²= 9.</div></div>
<div class="eb"><div class="eb-lbl">Worked Example</div><div class="eb-q">Simplify: (3x²)³ ÷ (9x⁻¹)</div>
<div class="step"><div class="step-n">1</div><div class="step-t">Expand bracket: (3)³×(x²)³ = 27x⁶</div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">Divide: 27x⁶ ÷ 9x⁻¹ = 3 × x⁶⁻⁽⁻¹⁾ = 3x⁷</div></div>
<span class="ans">3x⁷</span></div>
<div class="warn"><div class="warn-i"></div><div class="warn-t">(x+y)² ≠ x²+y². Indices distribute over multiplication, NOT addition. (xy)²=x²y² but (x+y)²=x²+2xy+y².</div></div>`},
{t:'Standard Form — Calculations',b:`<div class="wht">Standard form (scientific notation) keeps very large or small numbers manageable. Format: A×10ⁿ where 1≤A&lt;10.</div>
<div class="fb"><div class="fb-lbl">Four Operations in Standard Form</div><div class="fb-line">Multiply: (A×10ᵐ)×(B×10ⁿ) = (A×B)×10ᵐ⁺ⁿ</div><div class="fb-line">Divide: (A×10ᵐ)÷(B×10ⁿ) = (A÷B)×10ᵐ⁻ⁿ</div><div class="fb-line">Add/Subtract: make powers equal first, then add A-values</div><div class="fb-note">After any operation: check 1≤A&lt;10; if not, adjust</div></div>
<div class="eb"><div class="eb-lbl">Worked Example</div><div class="eb-q">(3.6×10⁵) + (9×10⁴)</div>
<div class="step"><div class="step-n">1</div><div class="step-t">Make powers equal: 9×10⁴ = 0.9×10⁵</div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">Add: (3.6+0.9)×10⁵ = 4.5×10⁵</div></div>
<span class="ans">4.5×10⁵</span></div>
<div class="warn"><div class="warn-i"></div><div class="warn-t">After multiplying, if A≥10 or A&lt;1, you must adjust. E.g. 13.5×10³ → 1.35×10⁴ (divide A by 10, add 1 to power).</div></div>`},
{t:'Compound Interest & Reverse Percentage',b:`<div class="fb"><div class="fb-lbl">Critical — NOT Given in Exam, Must Memorise</div><div class="fb-line">Compound growth: A = P(1 + r/100)ⁿ</div><div class="fb-line">Compound decay: A = P(1 − r/100)ⁿ</div><div class="fb-note">P=principal, r=rate%, n=years/periods, A=final amount</div></div>
<div class="kc"><strong>Reverse percentage:</strong> to find original BEFORE a percentage change, divide by the multiplier.<br>Price after 20% increase is £84 → original = 84 ÷ 1.20 = £70<br>Price after 15% decrease is £51 → original = 51 ÷ 0.85 = £60</div>
<div class="eb"><div class="eb-lbl">Worked Example</div><div class="eb-q">£5000 invested at 4% compound interest. After 6 years, how much interest was earned?</div>
<div class="step"><div class="step-n">1</div><div class="step-t">A = 5000×(1.04)⁶ = 5000×1.2653… = £6326.60</div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">Interest = £6326.60 − £5000 = £1326.60</div></div>
<span class="ans">£1326.60</span></div>`},
{t:'Surds — Simplifying and Rationalising [Extended]',b:`<div class="wht">Surds are exact irrational square roots. Always find the largest perfect square factor to simplify.</div>
<div class="fb"><div class="fb-lbl">Key Results</div><div class="fb-line">√(a×b) = √a × √b</div><div class="fb-line">√20 = √(4×5) = 2√5</div><div class="fb-line">Rationalise: multiply by surd/surd to clear the denominator</div><div class="fb-line">Conjugate: (a+√b)(a−√b) = a²−b (always rational!)</div></div>
<div class="eb"><div class="eb-lbl">Three Types of Rationalising</div>
<div class="step"><div class="step-n">A</div><div class="step-t">Simple: 10/√5 × √5/√5 = 10√5/5 = 2√5</div></div>
<div class="step"><div class="step-n">B</div><div class="step-t">Conjugate: 3/(2+√3) × (2−√3)/(2−√3) = 3(2−√3)/(4−3) = 3(2−√3) = 6−3√3</div></div>
<div class="step"><div class="step-n">C</div><div class="step-t">Simplify first: √200−√32 = 10√2−4√2 = 6√2</div></div></div>
<div class="tip"><div class="tip-i"></div><div class="tip-t">Perfect squares to know: 1,4,9,16,25,36,49,64,81,100,121,144,169,196,225,256. Check if any of these divide your number under the root.</div></div>`},
]},
{id:'na',name:'Algebra',clr:'#5b21b6',sub:'Factorising, quadratics, simultaneous equations, sequences',concepts:[
{t:'Factorising Quadratics — All Methods',b:`<div class="wht">Factorising a quadratic puts it into bracket form. There are three main types.</div>
<div class="kc"><strong>Type 1 — Simple (a=1):</strong> x²+bx+c = (x+p)(x+q) where p×q=c and p+q=b<br><strong>Type 2 — General (a≠1):</strong> find two numbers multiplying to ac and adding to b, then split and group<br><strong>Type 3 — Difference of two squares:</strong> a²−b² = (a+b)(a−b)</div>
<div class="eb"><div class="eb-lbl">All Three Types</div>
<div class="step"><div class="step-n">1</div><div class="step-t">x²+5x+6: need p×q=6, p+q=5 → p=2, q=3 → <strong>(x+2)(x+3)</strong></div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">2x²+7x+3: ac=6, need ×=6 +=7 → 6&amp;1 → 2x²+6x+x+3 = 2x(x+3)+1(x+3) = <strong>(2x+1)(x+3)</strong></div></div>
<div class="step"><div class="step-n">3</div><div class="step-t">9x²−25 = (3x)²−5² = <strong>(3x+5)(3x−5)</strong></div></div></div>
<div class="tip"><div class="tip-i"></div><div class="tip-t">Always expand your answer and check it gives back the original expression. This takes 10 seconds and guarantees marks.</div></div>
<div class="warn"><div class="warn-i"></div><div class="warn-t">(x+3)² = x²+6x+9 NOT x²+9. The middle term 2×x×3=6x is the most dropped term in the entire exam.</div></div>`},
{t:'Quadratic Formula — When and How [Extended]',b:`<div class="fb"><div class="fb-lbl">Given in Exam — But Know It Cold</div><div class="fb-line">x = (−b ± √(b² − 4ac)) / 2a</div><div class="fb-note">for ax²+bx+c=0; discriminant b²−4ac determines number of solutions</div></div>
<table class="kt"><tr><th>Discriminant</th><th>Number of solutions</th><th>Graph</th></tr>
<tr><td>b²−4ac &gt; 0</td><td>Two distinct real solutions</td><td>Crosses x-axis twice</td></tr>
<tr><td>b²−4ac = 0</td><td>One repeated solution</td><td>Touches x-axis</td></tr>
<tr><td>b²−4ac &lt; 0</td><td>No real solutions</td><td>Doesn't reach x-axis</td></tr></table>
<div class="eb"><div class="eb-lbl">Worked Example — Surd Form Answer</div><div class="eb-q">Solve 2x²−5x−1=0. Give answers in surd form.</div>
<div class="step"><div class="step-n">1</div><div class="step-t">a=2, b=−5, c=−1. Note b is negative!</div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">x = (5 ± √(25+8)) / 4 = (5 ± √33) / 4</div></div>
<span class="ans">x = (5+√33)/4 or x = (5−√33)/4</span></div>
<div class="warn"><div class="warn-i"></div><div class="warn-t">−b in the formula means negate b. If b=−5, then −b=+5. This is the most common error. Also: the ± gives TWO answers — always write both!</div></div>`},
{t:'Simultaneous Equations — Both Methods',b:`<div class="wht">Two equations, two unknowns. Choose elimination when coefficients can be matched, substitution when one equation is already solved for a variable.</div>
<div class="eb"><div class="eb-lbl">Elimination Method</div><div class="eb-q">3x+2y=12 and 5x−2y=4</div>
<div class="step"><div class="step-n">1</div><div class="step-t">y-coefficients are +2 and −2 → ADD equations: 8x=16 → x=2</div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">Sub into 1st: 6+2y=12 → y=3. CHECK in 2nd: 10−6=4 ✓</div></div>
<span class="ans">x=2, y=3</span></div>
<div class="eb"><div class="eb-lbl">Substitution Method</div><div class="eb-q">y=3x−1 and 2x+y=9</div>
<div class="step"><div class="step-n">1</div><div class="step-t">Sub y=3x−1 into second: 2x+(3x−1)=9 → 5x=10 → x=2</div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">y=3(2)−1=5. CHECK: 2(2)+5=9 ✓</div></div>
<span class="ans">x=2, y=5</span></div>
<div class="tip"><div class="tip-i"></div><div class="tip-t">Always substitute your final answers back into BOTH original equations to check. This is a 30-second check that is worth doing every time.</div></div>`},
{t:'Sequences — Finding the Nth Term',b:`<div class="wht">The nth term formula T(n) lets you find any term without listing them all. The type depends on which differences become constant.</div>
<table class="kt"><tr><th>Type</th><th>T(n) form</th><th>Sign</th><th>Find a using</th></tr>
<tr><td>Linear</td><td>an+b</td><td>1st diffs constant</td><td>a=common difference</td></tr>
<tr><td>Quadratic</td><td>an²+bn+c</td><td>2nd diffs constant</td><td>a=2nd diff÷2</td></tr>
<tr><td>Cubic</td><td>an³+…</td><td>3rd diffs constant</td><td>a=3rd diff÷6</td></tr></table>
<div class="eb"><div class="eb-lbl">Quadratic Sequence Example</div><div class="eb-q">Find nth term of: 3, 8, 15, 24, 35…</div>
<div class="step"><div class="step-n">1</div><div class="step-t">1st differences: 5, 7, 9, 11 (not constant)</div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">2nd differences: 2, 2, 2 (constant=2) → quadratic, a=2÷2=1</div></div>
<div class="step"><div class="step-n">3</div><div class="step-t">T(n)=n²+bn+c. T(1)=1+b+c=3 → b+c=2. T(2)=4+2b+c=8 → 2b+c=4. Solve: b=2, c=0</div></div>
<span class="ans">T(n) = n² + 2n</span></div>`},
]},
{id:'nf',name:'Functions',clr:'#065f46',sub:'Graph types, composite, inverse, logs, transformations',concepts:[
{t:'The 7 Graph Types — Recognise Instantly',b:`<div class="dg"><svg viewBox="0 0 540 140" width="540"><g transform="translate(4,10)"><rect width="74" height="74" rx="5" fill="#eef0fd" stroke="#bfdbfe" stroke-width="1.5"/><line x1="8" y1="66" x2="66" y2="8" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><text x="37" y="90" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="700">Linear</text><text x="37" y="102" text-anchor="middle" font-size="9" fill="#6b7280">ax+b</text></g>

<g transform="translate(324,10)"><rect width="74" height="74" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><path d="M8,66 Q22,62 32,52 Q46,34 66,10" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="37" y="90" text-anchor="middle" font-size="10" fill="#92400e" font-weight="700">Exponential</text><text x="37" y="102" text-anchor="middle" font-size="9" fill="#6b7280">aˣ (a&gt;1)</text></g>
<g transform="translate(404,10)"><rect width="74" height="74" rx="5" fill="#fff1f2" stroke="#fecaca" stroke-width="1.5"/><path d="M8,37 Q18,10 28,37 Q38,64 48,37 Q58,10 66,37" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="37" y="90" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="700">Sine/Cos</text><text x="37" y="102" text-anchor="middle" font-size="9" fill="#6b7280">a sin(bx)</text></g></svg><div class="dg-cap">Memorise the shape of each graph type — questions often ask you to identify from a sketch</div></div>
<table class="kt"><tr><th>Graph</th><th>Key features to write/sketch</th></tr>
<tr><td>Linear</td><td>Gradient a (positive slopes up, negative down); y-intercept b</td></tr>
<tr><td>Quadratic</td><td>Vertex (turning point); axis of symmetry; direction of opening</td></tr>
<tr><td>Cubic</td><td>Up to 2 turning points; long-term: positive a goes ↙↗</td></tr>
<tr><td>Reciprocal</td><td>Asymptotes at x=0 (vertical) and y=0 (horizontal); never touches axes</td></tr>
<tr><td>Exponential (a&gt;1)</td><td>Passes through (0,1); asymptote at y=0; always positive</td></tr>
<tr><td>Sine</td><td>Amplitude=1 (or |a|); period=360° (or 360°/b); starts at 0</td></tr>
<tr><td>Cosine</td><td>Same as sine but starts at maximum (cos 0°=1)</td></tr></table>`},
{t:'Composite Functions gf(x) — Order Matters!',b:`<div class="kc"><strong>gf(x) = g(f(x))</strong> — read the letters right to left: apply f FIRST, then g to the result.<br><br>Think of it like a machine: input → [f machine] → [g machine] → output<br><br>gf ≠ fg in general — the order changes the answer!</div>
<div class="eb"><div class="eb-lbl">Worked Example</div><div class="eb-q">f(x)=3x+1 and g(x)=x². Find (a) gf(x) (b) fg(2) (c) gf(2)</div>
<div class="step"><div class="step-n">a</div><div class="step-t">gf(x)=g(f(x))=g(3x+1)=(3x+1)²=9x²+6x+1</div></div>
<div class="step"><div class="step-n">b</div><div class="step-t">fg(2): first g(2)=4, then f(4)=3(4)+1=13</div></div>
<div class="step"><div class="step-n">c</div><div class="step-t">gf(2): first f(2)=7, then g(7)=49</div></div></div>
<div class="warn"><div class="warn-i"></div><div class="warn-t">gf(x): the letter CLOSEST to x is applied FIRST. g comes first in gf(x) when reading left to right, but f is applied first. This trips up almost everyone initially.</div></div>`},
{t:'Inverse Functions f⁻¹(x)',b:`<div class="wht">The inverse function reverses the mapping. If f sends x to y, then f⁻¹ sends y back to x.</div>
<div class="fb"><div class="fb-lbl">Method — 3 Steps</div><div class="fb-line">1. Write y = f(x)</div><div class="fb-line">2. Swap x and y</div><div class="fb-line">3. Rearrange for y — this is f⁻¹(x)</div></div>
<div class="eb"><div class="eb-lbl">Worked Example</div><div class="eb-q">Find f⁻¹(x) for f(x) = (2x−3)/5</div>
<div class="step"><div class="step-n">1</div><div class="step-t">y=(2x−3)/5</div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">Swap: x=(2y−3)/5</div></div>
<div class="step"><div class="step-n">3</div><div class="step-t">5x=2y−3 → 2y=5x+3 → y=(5x+3)/2</div></div>
<span class="ans">f⁻¹(x) = (5x+3)/2</span></div>
<div class="tip"><div class="tip-i"></div><div class="tip-t">Quick check: substitute a simple value. f(3)=(6−3)/5=3/5. Then f⁻¹(3/5)=(5×3/5+3)/2=(3+3)/2=3 ✓</div></div>`},
]},
{id:'nc',name:'Coordinate Geometry',clr:'#9a3412',sub:'Gradient, line equations, perpendicular bisector',concepts:[
{t:'Everything About Straight Lines',b:`<div class="fb"><div class="fb-lbl">Three Essential Formulas</div><div class="fb-line">Gradient: m = (y₂−y₁)/(x₂−x₁)</div><div class="fb-line">Length: d = √((x₂−x₁)² + (y₂−y₁)²)</div><div class="fb-line">Midpoint: M = ((x₁+x₂)/2, (y₁+y₂)/2)</div></div>
<div class="kc"><strong>To find equation of a line</strong> given gradient m and point (x₁,y₁):<br>Use y−y₁ = m(x−x₁) then rearrange to y=mx+c form<br><br><strong>Parallel lines:</strong> same gradient (m₁=m₂)<br><strong>Perpendicular lines [Extended]:</strong> m₁×m₂=−1, so m₂=−1/m₁ (flip fraction, change sign)</div>
<div class="eb"><div class="eb-lbl">Worked Example — Perpendicular Bisector</div><div class="eb-q">Find the perpendicular bisector of the segment from A(1,3) to B(5,9).</div>
<div class="step"><div class="step-n">1</div><div class="step-t">Midpoint M = (3, 6)</div></div>
<div class="step"><div class="step-n">2</div><div class="step-t">Gradient AB = (9−3)/(5−1) = 6/4 = 3/2</div></div>
<div class="step"><div class="step-n">3</div><div class="step-t">Perpendicular gradient = −2/3 (flip and negate)</div></div>
<div class="step"><div class="step-n">4</div><div class="step-t">Line through M(3,6) with m=−2/3: y−6=−2/3(x−3) → y=−2/3x+8</div></div>
<span class="ans">y = −⅔x + 8</span></div>
<div class="warn"><div class="warn-i"></div><div class="warn-t">When finding perpendicular gradient from ax+by=c: rearrange to y=mx+c FIRST to find m, then take −1/m. Don't try to read gradient directly from ax+by=c form.</div></div>`},
]},

]},

{id:'np',name:'Probability',clr:'#991b1b',sub:'All probability rules, tree diagrams, Venn diagrams',concepts:[
{t:'Core Probability Rules',b:`<div class="fb"><div class="fb-lbl">The Big Three Rules</div><div class="fb-line">P(not A) = 1 − P(A)</div><div class="fb-line">P(A or B) = P(A) + P(B) &nbsp; — for MUTUALLY EXCLUSIVE events only</div><div class="fb-line">P(A and B) = P(A) × P(B) &nbsp; — for INDEPENDENT events only</div></div>
<div class="warn"><div class="warn-i"></div><div class="warn-t">The most common exam mistake: multiplying when you should add, or adding when you should multiply. AND = multiply (along branches). OR = add (the end results).</div></div>
<div class="tip"><div class="tip-i"></div><div class="tip-t">Mutually exclusive = cannot both happen at same time (e.g. rolling a 3 AND a 5 on one die). Independent = one doesn't affect the other (e.g. two separate coin flips).</div></div>`},
{t:'Tree Diagrams — With and Without Replacement',b:`<div class="dg"><svg viewBox="0 0 400 200" width="400">
<text x="200" y="14" text-anchor="middle" font-size="11" fill="#374151" font-weight="700">Bag: 3 Red, 2 Blue — Draw 2 WITHOUT replacement</text>
<circle cx="36" cy="104" r="5" fill="#374151"/>
<line x1="41" y1="104" x2="130" y2="60" stroke="#dc2626" stroke-width="1.5"/>
<line x1="41" y1="104" x2="130" y2="148" stroke="#2563eb" stroke-width="1.5"/>

   GDC GUIDE — TI-Nspire CX II (non-CAS)
════════════════════════════════════════════════════════════ */
const KY=k=>`<span class="key">${k}</span>`,KB=k=>`<span class="key b">${k}</span>`,MN=s=>`<b>${s}</b>`;
GDC_SKILLS.length=0;
GDC_SKILLS.push(
{ico:'sliders',title:'Exam setup (do this first!)',sub:'Degree mode · Press-to-Test',steps:[
 `Set degrees: ${KY('⌂ on')} → ${MN('Settings')} → ${MN('Document Settings')} → Angle: ${MN('Degree')} → ${MN('Make Default')}.`,
 `Check it: on a Calculator page, sin(30) must give ${MN('0.5')}.`,
 `Press-to-Test (your exam centre may ask for it): press and hold ${KY('esc')} and ${KY('⌂ on')} together until the Press-to-Test screen appears. On that screen set <b>Angle Setting → Degree</b> before pressing Enter. The LED blinks while it is on.`,
 `Cambridge exams need a calculator WITHOUT symbolic algebra (CAS). The standard TI-Nspire CX II (non-CAS) is the right model — not the “CX II CAS”.`,
 `Charge it the night before (USB cable). Update the OS from TI if your teacher says so.`],
 note:'Radian mode is the #1 silent mark-loser in trigonometry. Check DEG at the start of Papers 4 and 6.'},
{ico:'papers',title:'Documents & pages',sub:'Find your way around',steps:[
 `New document: ${KY('⌂ on')} → ${MN('New')} (or ${KB('ctrl')}+${KY('N')}).`,
 `Add a page: ${KB('ctrl')}+${KY('doc')} (insert page) → choose ${MN('Calculator')}, ${MN('Graphs')} or ${MN('Lists & Spreadsheet')}.`,
 `Switch pages: ${KB('ctrl')}+${KY('◀')} / ${KB('ctrl')}+${KY('▶')}.`,
 `Undo: ${KB('ctrl')}+${KY('esc')}. Context menu (super useful): ${KB('ctrl')}+${KY('menu')}.`,
 `Don’t save old documents when asked in an exam — start fresh with ${MN('New')}.`],
 note:'Each page type has its own menu — press menu on the page you are using.'},
{ico:'calc',title:'Calculator page essentials',sub:'Fractions, exact vs decimal, ANS',steps:[
 `Fraction template: ${KB('ctrl')}+${KY('÷')}. Square root: ${KB('ctrl')}+${KY('x²')}. nth root: ${KB('ctrl')}+${KY('^')}.`,
 `${KY('enter')} gives an exact answer (e.g. 2/3); ${KB('ctrl')}+${KY('enter')} gives the decimal approximation (≈).`,
 `Previous answer: ${KB('ctrl')}+${KY('(−)')} (ans). Use it instead of re-typing rounded values.`,
 `Store a value: type it, then ${KB('ctrl')}+${KY('var')} (sto→) and a name, e.g. a. Use a later in calculations.`,
 `Negative numbers use the ${KY('(−)')} key, not the subtract key.`,
 `π: press ${KY('π▸')} (or the π template) — never type 3.14.`],
 note:'Keep full accuracy in the calculator and only round your final answer (3 s.f. unless told otherwise).'},
{ico:'graph',title:'Graphing a function',sub:'Graphs page',steps:[
 `Add a ${MN('Graphs')} page. The entry line shows f1(x)= — type the function and press ${KY('enter')}.`,
 `Add another function: ${KY('tab')} opens the entry line again (f2, f3…).`,
 `Window: ${KY('menu')} → ${MN('Window/Zoom')} → ${MN('Window Settings')} (type XMin, XMax, YMin, YMax), or ${MN('Zoom – Fit')} / ${MN('Zoom – Standard')}.`,
 `Trace along a curve: ${KY('menu')} → ${MN('Trace')} → ${MN('Graph Trace')}; type an x value then ${KY('enter')} to jump to it.`,
 `Sketch in the exam: copy the shape, intercepts, turning points and asymptotes onto the axes given.`],
 note:'If you can’t see the graph, use Zoom – Fit, or set the window to match the domain in the question.'},
{ico:'grid',title:'Table of values',sub:'For plotting points',steps:[
 `On a Graphs page with your function entered, press ${KB('ctrl')}+${KY('T')} — a table appears beside the graph.`,
 `Change the start value and step: ${KY('menu')} → ${MN('Table')} → ${MN('Edit Table Settings')}.`,
 `Scroll with the arrow keys; ${KB('ctrl')}+${KY('T')} again hides the table.`],
 note:'Perfect for “complete the table” questions — but check each value makes sense on the graph.'},
{ico:'search',title:'Zeros (roots)',sub:'Where the graph crosses the x-axis',steps:[
 `Graph the function on a Graphs page.`,
 `${KY('menu')} → ${MN('6: Analyze Graph')} → ${MN('1: Zero')}.`,
 `Move to the LEFT of the root and press ${KY('click')} (lower bound), then to the RIGHT and ${KY('click')} (upper bound).`,
 `The zero is labelled with its coordinates. Repeat for each root.`],
 note:'Solving f(x) = 0 is the same as finding the zeros of y = f(x).'},
{ico:'axes',title:'Maximum, minimum & vertex',sub:'Turning points',steps:[
 `${KY('menu')} → ${MN('6: Analyze Graph')} → ${MN('2: Minimum')} or ${MN('3: Maximum')}.`,
 `Set the lower and upper bounds around the turning point (click left, then right of it).`,
 `Read the coordinates. For a quadratic, this IS the vertex.`],
 note:'∪-shaped quadratic (a > 0) → Minimum. ∩-shaped (a < 0) → Maximum.'},
{ico:'target',title:'Intersection of two graphs',sub:'Solve any equation f(x) = g(x)',steps:[
 `Enter f1(x) = left side and f2(x) = right side.`,
 `${KY('menu')} → ${MN('6: Analyze Graph')} → ${MN('4: Intersection')}.`,
 `Click to the left of the crossing point (lower bound), then to the right (upper bound).`,
 `Read x (and y). Repeat for every crossing point in the domain.`],

function txt(x,y,t,o={}){return`<text x="${r2(x)}" y="${r2(y)}" class="${o.cls||''}" text-anchor="${o.a||'middle'}" dominant-baseline="${o.b||'middle'}" style="${D(o.d)}${HALO}fill:${cc(o.c||'ink')};font-size:${o.s||13}px;font-weight:${o.w||600};${o.it?'font-style:italic;':''}">${t}</text>`;}
function pth(d,o={}){return`<path d="${d}" pathLength="1" class="${o.cls??'draw'}" style="${D(o.d)}fill:${o.fill?cc(o.fill):'none'};${o.fo!=null?`fill-opacity:${o.fo};`:''}stroke:${o.c==='none'?'none':cc(o.c||'ink')};stroke-width:${o.w||2.5}px;stroke-linecap:round;stroke-linejoin:round;${o.dash?`stroke-dasharray:${o.dash};`:''}"/>`;}
function arrowHead(x1,y1,x2,y2,c,s=9,o={}){const a=Math.atan2(y2-y1,x2-x1);const p=[[x2,y2],[x2-s*Math.cos(a-0.42),y2-s*Math.sin(a-0.42)],[x2-s*Math.cos(a+0.42),y2-s*Math.sin(a+0.42)]];return`<polygon points="${p.map(q=>q.map(r2).join(',')).join(' ')}" class="${o.cls??'pop'}" style="${D(o.d)}fill:${cc(c)}"/>`;}
function svgWrap(W,H,inner,o={}){return`<svg viewBox="0 0 ${W} ${H}" class="viz ${o.cls||''}" role="img" style="${o.mw?`max-width:${o.mw}px;`:''}">${inner}</svg>`;}
const deg=a=>a*Math.PI/180;

/* ── Coordinate plot builder ── */
function Plot(o={}){
  const W=o.w||420,H=o.h||300,pad=o.pad??30;
  const [x0,x1]=o.x||[-5,5],[y0,y1]=o.y||[-5,5];
  const sx=x=>pad+(x-x0)/(x1-x0)*(W-2*pad), sy=y=>H-pad-(y-y0)/(y1-y0)*(H-2*pad);
  const cid=uid('clip');const L=[];
  const api={sx,sy,W,H,x0,x1,y0,y1,
    grid(step=o.step||1,lab=o.lab||step,opt={}){
      let s='';
      for(let x=Math.ceil(x0/step)*step;x<=x1+1e-9;x+=step)s+=`<line x1="${r2(sx(x))}" y1="${r2(sy(y0))}" x2="${r2(sx(x))}" y2="${r2(sy(y1))}" style="stroke:var(--v-grid);stroke-width:1"/>`;
      const ys=opt.ystep||step;
      for(let y=Math.ceil(y0/ys)*ys;y<=y1+1e-9;y+=ys)s+=`<line x1="${r2(sx(x0))}" y1="${r2(sy(y))}" x2="${r2(sx(x1))}" y2="${r2(sy(y))}" style="stroke:var(--v-grid);stroke-width:1"/>`;
      const ax=Math.min(Math.max(0,y0),y1),ay=Math.min(Math.max(0,x0),x1);
      s+=`<line x1="${sx(x0)}" y1="${sy(ax)}" x2="${sx(x1)}" y2="${sy(ax)}" style="stroke:var(--v-axis);stroke-width:1.6"/>`+arrowHead(sx(x0),sy(ax),sx(x1)+6,sy(ax),'var(--v-axis)',7,{cls:''});
      s+=`<line x1="${sx(ay)}" y1="${sy(y0)}" x2="${sx(ay)}" y2="${sy(y1)}" style="stroke:var(--v-axis);stroke-width:1.6"/>`+arrowHead(sx(ay),sy(y0),sx(ay),sy(y1)-6,'var(--v-axis)',7,{cls:''});
      s+=txt(sx(x1)+2,sy(ax)-12,opt.xl||'x',{c:'mut',s:12,it:1,a:'end'})+txt(sx(ay)+12,sy(y1)+2,opt.yl||'y',{c:'mut',s:12,it:1,a:'start'});
      if(lab){const yl=opt.ylab||lab;
        for(let x=Math.ceil(x0/lab)*lab;x<=x1+1e-9;x+=lab){if(Math.abs(x)<1e-9)continue;s+=txt(sx(x),sy(ax)+12,opt.fx?opt.fx(x):r2(x),{c:'mut',s:10.5,w:500});}
        for(let y=Math.ceil(y0/yl)*yl;y<=y1+1e-9;y+=yl){if(Math.abs(y)<1e-9)continue;s+=txt(sx(ay)-6,sy(y),opt.fy?opt.fy(y):r2(y),{c:'mut',s:10.5,w:500,a:'end'});}
        if(x0<=0&&y0<=0)s+=txt(sx(0)-7,sy(0)+11,'0',{c:'mut',s:10.5,w:500,a:'end'});
      }
      L.push(s);return api;},
    fn(f,op={}){
      const n=op.n||300,a=op.from??x0,b=op.to??x1,span=y1-y0;let d='',pen=false,prev=null;
      for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,y=f(x);
        if(!isFinite(y)||y>y1+span*2||y<y0-span*2||(prev!=null&&Math.abs(y-prev)>span*1.2)){pen=false;prev=isFinite(y)?y:null;continue;}
        d+=(pen?'L':'M')+r2(sx(x))+' '+r2(sy(y));pen=true;prev=y;}
      L.push(`<g clip-path="url(#${cid})">${pth(d,{c:op.c||'v1',w:op.w||3,d:op.d,dash:op.dash,cls:op.cls})}</g>`);
      if(op.label)L.push(txt(sx(op.label[0]),sy(op.label[1]),op.label[2],{c:op.c||'v1',s:13,w:700,d:(op.d||0)+.6,cls:'fade',a:op.label[3]||'middle'}));
      return api;},
    seg(a,b,op={}){L.push(pth(`M${r2(sx(a[0]))} ${r2(sy(a[1]))}L${r2(sx(b[0]))} ${r2(sy(b[1]))}`,{c:op.c||'ink',w:op.w||2.5,d:op.d,dash:op.dash,cls:op.cls}));
      if(op.arrow)L.push(arrowHead(sx(a[0]),sy(a[1]),sx(b[0]),sy(b[1]),cc(op.c||'ink'),10,{d:(op.d||0)+.7}));
      if(op.label)L.push(txt((sx(a[0])+sx(b[0]))/2+(op.lo?op.lo[0]:0),(sy(a[1])+sy(b[1]))/2+(op.lo?op.lo[1]:-12),op.label,{c:op.c||'ink',d:(op.d||0)+.5,cls:'fade',s:op.ls||13,w:700}));
      return api;},
    line(m,c,op={}){return api.fn(x=>m*x+c,op);},
    vline(x,op={}){return api.seg([x,y0],[x,y1],Object.assign({dash:'6 5',c:'mut',w:1.8},op));},
    hline(y,op={}){return api.seg([x0,y],[x1,y],Object.assign({dash:'6 5',c:'mut',w:1.8},op));},
    pt(x,y,op={}){const c=cc(op.c||'v2');
      L.push(`<g class="${op.cls??'pop'}" style="${D(op.d)}"${op.s!=null?` data-s="${op.s}"`:''}>${op.cross?`<path d="M${sx(x)-5} ${sy(y)-5}l10 10m0 -10l-10 10" style="stroke:${c};stroke-width:2.4"/>`:`<circle cx="${r2(sx(x))}" cy="${r2(sy(y))}" r="${op.r||5.5}" style="fill:${op.open?'var(--v-bg)':c};stroke:${c};stroke-width:2.5"/>`}${op.label?txt(sx(x)+(op.lx??0),sy(y)+(op.ly??-16),op.label,{c:op.lc||op.c||'ink',s:12.5,w:700,a:op.la||'middle'}):''}</g>`);return api;},
    text(x,y,t,op={}){L.push(txt(sx(x),sy(y),t,Object.assign({cls:'fade'},op)));return api;},
    poly(pts,op={}){const d='M'+pts.map(p=>r2(sx(p[0]))+' '+r2(sy(p[1]))).join('L')+(op.open?'':'Z');L.push(`<g${op.s!=null?` data-s="${op.s}"`:''}>${pth(d,{c:op.c||'v1',w:op.w||2.5,fill:op.fill,fo:op.fo??.18,d:op.d,dash:op.dash,cls:op.cls})}</g>`);return api;},
    region(pts,op={}){const d='M'+pts.map(p=>r2(sx(p[0]))+' '+r2(sy(p[1]))).join('L')+'Z';L.push(`<g clip-path="url(#${cid})"><path d="${d}" class="${op.cls??'fade'}" style="${D(op.d)}fill:${cc(op.c||'v1')};fill-opacity:${op.fo??.16};stroke:none"/></g>`);return api;},
    raw(s){L.push(s);return api;},
    svg(extra={}){return svgWrap(W,H,`<defs><clipPath id="${cid}"><rect x="${sx(x0)}" y="${sy(y1)}" width="${sx(x1)-sx(x0)}" height="${sy(y0)-sy(y1)}"/></clipPath></defs>`+L.join(''),extra);}
  };
  return api;
}

/* ── Number line ── */
function nline(o){
  const W=o.w||440,H=o.h||86,pad=26,[a,b]=[o.min,o.max];const sx=x=>pad+(x-a)/(b-a)*(W-2*pad);const y=H/2+8;
  let s=pth(`M${pad-10} ${y}L${W-pad+10} ${y}`,{c:'var(--v-axis)',w:2,cls:''});
  for(let x=a;x<=b+1e-9;x+=(o.step||1)){s+=`<line x1="${sx(x)}" y1="${y-6}" x2="${sx(x)}" y2="${y+6}" style="stroke:var(--v-axis);stroke-width:1.6"/>`+txt(sx(x),y+20,o.fl?o.fl(x):r2(x),{c:'mut',s:12,w:500});}
  (o.ranges||[]).forEach((r,i)=>{const L=r.from==null?pad-12:sx(r.from),R=r.to==null?W-pad+12:sx(r.to),yy=y-22-i*16,dd=r.d??i*.9;
    s+=pth(`M${L} ${yy}L${R} ${yy}`,{c:r.c||'v1',w:3.5,d:dd});
    if(r.from==null)s+=arrowHead(L+20,yy,L-2,yy,cc(r.c||'v1'),10,{d:dd+.6});
    if(r.to==null)s+=arrowHead(R-20,yy,R+2,yy,cc(r.c||'v1'),10,{d:dd+.6});
    if(r.from!=null)s+=`<circle cx="${L}" cy="${yy}" r="6" class="pop" style="${D(dd)}fill:${r.incL?cc(r.c||'v1'):'var(--v-bg)'};stroke:${cc(r.c||'v1')};stroke-width:2.5"/>`;
    if(r.to!=null)s+=`<circle cx="${R}" cy="${yy}" r="6" class="pop" style="${D(dd+.5)}fill:${r.incR?cc(r.c||'v1'):'var(--v-bg)'};stroke:${cc(r.c||'v1')};stroke-width:2.5"/>`;
    if(r.label)s+=txt((L+R)/2,yy-13,r.label,{c:r.c||'v1',d:dd+.6,cls:'fade',s:13,w:700});});
  (o.pts||[]).forEach((p,i)=>{s+=`<circle cx="${sx(p[0])}" cy="${y}" r="5.5" class="pop" style="${D(p[2]??i*.25)}fill:${cc(p[3]||'v2')}"/>`+(p[1]?txt(sx(p[0]),y-17,p[1],{c:p[3]||'v2',d:(p[2]??i*.25),cls:'fade',s:13,w:700}):'');});
  (o.jumps||[]).forEach((j,i)=>{const x1=sx(j[0]),x2=sx(j[1]),h=Math.min(40,Math.abs(x2-x1)/1.6);s+=pth(`M${x1} ${y-4}Q${(x1+x2)/2} ${y-4-h*1.6} ${x2} ${y-4}`,{c:j[3]||'v3',w:2.2,d:j[4]??i*.5})+arrowHead((x1+x2)/2+(x2-x1)*.3,y-4-h*.9,x2,y-4,cc(j[3]||'v3'),8,{d:(j[4]??i*.5)+.6})+(j[2]?txt((x1+x2)/2,y-10-h*1.25,j[2],{c:j[3]||'v3',d:(j[4]??i*.5)+.4,cls:'fade',s:12,w:700}):'');});
  return svgWrap(W,H,s,{mw:o.mw});
}

/* ── Triangles ── */
function rtri(o={}){ // right angle at bottom-left B; θ at bottom-right C
  const W=o.w||340,H=o.h||230;const A=[60,30],B=[60,H-40],C=[W-50,H-40];
  const hl=o.hl||{};const L=o.labels||{};
  let s='';
  s+=`<path d="M${A}L${B}L${C}Z" class="fade" style="fill:var(--v1);fill-opacity:.07;stroke:none"/>`;
  s+=pth(`M${B}L${C}`,{c:hl.adj||'ink',w:hl.adj?4.5:2.6,d:.1})+pth(`M${A}L${B}`,{c:hl.opp||'ink',w:hl.opp?4.5:2.6,d:.4})+pth(`M${A}L${C}`,{c:hl.hyp||'ink',w:hl.hyp?4.5:2.6,d:.7});
  s+=`<path d="M${B[0]} ${B[1]-16}h16v16" style="fill:none;stroke:var(--v-ink);stroke-width:1.6"/>`;
  const ang=Math.atan2(B[1]-A[1],C[0]-A[0]);
  if(o.theta!==false){s+=pth(`M${C[0]-40} ${C[1]}A40 40 0 0 1 ${r2(C[0]-40*Math.cos(Math.atan2(C[1]-A[1],C[0]-A[0])))} ${r2(C[1]-40*Math.sin(Math.atan2(C[1]-A[1],C[0]-A[0])))}`,{c:'v4',w:2.2,d:1}).replace('A40 40 0 0 1','A40 40 0 0 0');
    s+=txt(C[0]-58,C[1]-12,o.theta||'θ',{c:'v4',d:1.1,cls:'fade',s:15,w:700,it:1});}
  if(o.topAngle)s+=txt(A[0]+14,A[1]+40,o.topAngle,{c:'v4',s:14,w:700,cls:'fade',d:1.1});
  s+=txt((B[0]+C[0])/2,B[1]+20,L.adj??'adjacent',{c:hl.adj||'mut',s:14,w:700,cls:'fade',d:.3});
  s+=txt(A[0]-14,(A[1]+B[1])/2,L.opp??'opposite',{c:hl.opp||'mut',s:14,w:700,cls:'fade',d:.6,a:'end'});
  s+=txt((A[0]+C[0])/2+16,(A[1]+C[1])/2-14,L.hyp??'hypotenuse',{c:hl.hyp||'mut',s:14,w:700,cls:'fade',d:.9,a:'start'});
  return svgWrap(W,H+10,s,{mw:o.mw||380});
}
function gtri(o={}){ // general triangle with vertices A (top), B (left), C (right)
  const W=o.w||340,H=o.h||220;const A=o.A||[150,26],B=[30,H-30],C=[W-30,H-30];
  let s=`<path d="M${A}L${B}L${C}Z" class="fade" style="fill:var(--v3);fill-opacity:.07"/>`+pth(`M${A}L${B}L${C}Z`,{c:'ink',w:2.6});
  const V=o.v||['A','B','C'];
  s+=txt(A[0],A[1]-13,V[0],{s:15,w:800,cls:'fade',d:.6})+txt(B[0]-12,B[1]+8,V[1],{s:15,w:800,cls:'fade',d:.6})+txt(C[0]+12,C[1]+8,V[2],{s:15,w:800,cls:'fade',d:.6});
  const sd=o.sides||['a','b','c'];// a opposite A = BC, b opposite B = CA, c opposite C = AB
  s+=txt((B[0]+C[0])/2,B[1]+18,sd[0],{c:'v2',s:15,w:700,it:1,cls:'fade',d:.9});
  s+=txt((A[0]+C[0])/2+16,(A[1]+C[1])/2-6,sd[1],{c:'v1',s:15,w:700,it:1,cls:'fade',d:.9});
  s+=txt((A[0]+B[0])/2-16,(A[1]+B[1])/2-6,sd[2],{c:'v3',s:15,w:700,it:1,cls:'fade',d:.9});
  (o.angles||[]).forEach(([P,lab])=>{const p={A,B,C}[P];s+=txt(p[0]+(P==='B'?34:P==='C'?-34:0),p[1]+(P==='A'?30:-10),lab,{c:'v4',s:13,w:700,cls:'fade',d:1.1});});
  return svgWrap(W,H+8,s,{mw:o.mw||380});
}

/* ── Circle-theorem diagrams (geometry computed from angles) ── */
function ctheorem(kind,o={}){
  const W=300,H=260,cx=150,cy=128,R=96;const P=a=>[r2(cx+R*Math.cos(deg(a))),r2(cy-R*Math.sin(deg(a)))];
  const dot=(p,l,d,off=[0,0])=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" class="pop" style="${D(d)}fill:var(--v-ink)"/>`+(l?txt(p[0]+off[0],p[1]+off[1],l,{s:14,w:800,cls:'fade',d}):'');
  const lab=(p,a,t,c,d)=>{const q=[p[0]+18*Math.cos(deg(a)),p[1]-18*Math.sin(deg(a))];return txt(q[0],q[1],t,{c,s:13,w:800,cls:'fade',d});};
  const arcAt=(p,a1,a2,r,c,d)=>{ // angle arc at point p from direction a1 to a2 (degrees, math orientation)
    const s1=[p[0]+r*Math.cos(deg(a1)),p[1]-r*Math.sin(deg(a1))],s2=[p[0]+r*Math.cos(deg(a2)),p[1]-r*Math.sin(deg(a2))];
    let sw=((a2-a1)%360+360)%360;return pth(`M${r2(s1[0])} ${r2(s1[1])}A${r} ${r} 0 ${sw>180?1:0} 0 ${r2(s2[0])} ${r2(s2[1])}`,{c,w:2.4,d});};
  const dir=(p,q)=>Math.atan2(-(q[1]-p[1]),q[0]-p[0])*180/Math.PI;
  const right=(p,a1,a2,d)=>{const u=[Math.cos(deg(a1)),-Math.sin(deg(a1))],v=[Math.cos(deg(a2)),-Math.sin(deg(a2))],k=13;return`<path d="M${r2(p[0]+u[0]*k)} ${r2(p[1]+u[1]*k)}L${r2(p[0]+u[0]*k+v[0]*k)} ${r2(p[1]+u[1]*k+v[1]*k)}L${r2(p[0]+v[0]*k)} ${r2(p[1]+v[1]*k)}" class="fade" style="${D(d)}fill:none;stroke:var(--bad);stroke-width:2.2"/>`;};
  const O=[cx,cy];let s=pth(`M${cx+R} ${cy}A${R} ${R} 0 1 0 ${cx-R} ${cy}A${R} ${R} 0 1 0 ${cx+R} ${cy}`,{c:'v1',w:2.6,d:0});
  const seg=(p,q,c,d,w)=>pth(`M${p[0]} ${p[1]}L${q[0]} ${q[1]}`,{c:c||'ink',w:w||2.4,d});
  if(kind==='semicircle'){const A=P(180),B=P(0),C=P(o.c??118);
    s+=seg(A,B,'v2',.5)+dot(O,'O',.5,[0,14])+seg(A,C,'ink',.9)+seg(B,C,'ink',1.1)+dot(A,'A',.5,[-14,0])+dot(B,'B',.5,[14,0])+dot(C,'C',.9,[0,-14])+right(C,dir(C,A),dir(C,B),1.6)+txt(cx,H-6,'diameter AB → angle ACB = 90°',{c:'v2',s:13,w:700,cls:'fade',d:1.8});}
  if(kind==='tangent'){const T=P(-30),tgA=[T[0]-110*Math.cos(deg(60)),T[1]-110*Math.sin(deg(60))],tgB=[T[0]+80*Math.cos(deg(60)),T[1]+80*Math.sin(deg(60))];
    s+=dot(O,'O',.4,[-12,-10])+seg(O,T,'v2',.6)+seg([r2(tgA[0]),r2(tgA[1])],[r2(tgB[0]),r2(tgB[1])],'v3',1)+dot(T,'T',.6,[-14,10])+right(T,dir(T,O),dir(T,tgA),1.6)+txt(cx,H-6,'tangent ⟂ radius at T',{c:'v3',s:13,w:700,cls:'fade',d:1.8});}
  if(kind==='twotangents'){const Pp=[cx+R*1.9,cy];const t=Math.acos(1/1.9)*180/Math.PI;const A=P(t),B=P(-t);
    s+=dot(O,'O',.3,[-12,0])+seg(Pp,A,'v3',.6)+seg(Pp,B,'v3',.8)+dot(A,'A',.6,[-6,-14])+dot(B,'B',.8,[-6,14])+seg(O,A,'mut',1,1.6)+seg(O,B,'mut',1.1,1.6)+dot(Pp,'P',.4,[12,0])+txt((A[0]+Pp[0])/2+8,(A[1]+Pp[1])/2-10,'=',{c:'bad',s:18,w:800,cls:'fade',d:1.4})+txt((B[0]+Pp[0])/2+8,(B[1]+Pp[1])/2+12,'=',{c:'bad',s:18,w:800,cls:'fade',d:1.4})+txt(cx+30,H-6,'PA = PB',{c:'v3',s:13,w:700,cls:'fade',d:1.8});
    return svgWrap(W+40,H,s);}
  if(kind==='centre'){const A=P(205),B=P(-25),C=P(o.c??100);
    s+=seg(O,A,'v2',.5)+seg(O,B,'v2',.6)+seg(C,A,'v3',.9)+seg(C,B,'v3',1)+dot(O,'O',.4,[0,16])+dot(A,'A',.4,[-12,6])+dot(B,'B',.4,[12,6])+dot(C,'C',.8,[0,-14])
      +arcAt(O,dir(O,B),dir(O,A),22,'v2',1.3)+arcAt(C,dir(C,A),dir(C,B),26,'v3',1.5)+txt(O[0],O[1]+30,o.t2||'2x',{c:'v2',s:14,w:800,cls:'fade',d:1.5})+txt(C[0],C[1]+40,o.t1||'x',{c:'v3',s:14,w:800,cls:'fade',d:1.7})+txt(cx,H-6,'angle at centre = 2 × angle at circumference',{c:'v2',s:12.5,w:700,cls:'fade',d:1.9});}
  if(kind==='samesegment'){const A=P(200),B=P(-20),C=P(120),Dp=P(60);
    s+=seg(A,B,'mut',.3,1.6)+seg(A,C,'v3',.6)+seg(B,C,'v3',.7)+seg(A,Dp,'v4',.9)+seg(B,Dp,'v4',1)+dot(A,'A',.3,[-12,6])+dot(B,'B',.3,[12,6])+dot(C,'C',.6,[-8,-14])+dot(Dp,'D',.9,[8,-14])
      +arcAt(C,dir(C,A),dir(C,B),24,'v3',1.3)+arcAt(Dp,dir(Dp,A),dir(Dp,B),24,'v4',1.5)+txt(cx,H-6,'∠ACB = ∠ADB (same arc AB)',{c:'v3',s:13,w:700,cls:'fade',d:1.9});}
  if(kind==='cyclic'){const A=P(150),B=P(220),C=P(-40),Dp=P(50);
    s+=pth(`M${A}L${B}L${C}L${Dp}Z`,{c:'v3',w:2.6,d:.5})+dot(A,'A',.4,[-12,-8])+dot(B,'B',.4,[-10,10])+dot(C,'C',.4,[12,10])+dot(Dp,'D',.4,[10,-10])

/* ── Transformations on a grid ── */
function tgrid(o){
  // o.shape=[[x,y]...], o.kind: 'translate'|'reflect'|'rotate'|'enlarge', params
  const P=Plot({w:o.w||380,h:o.h||300,x:o.x||[-6,6],y:o.y||[-5,5],pad:26});P.grid(1,o.lab??2);
  const sh=o.shape,poly=pts=>'M'+pts.map(p=>r2(P.sx(p[0]))+' '+r2(P.sy(p[1]))).join('L')+'Z';
  let img;const k=o.kind;
  if(k==='translate')img=sh.map(p=>[p[0]+o.v[0],p[1]+o.v[1]]);
  if(k==='reflect')img=sh.map(p=>o.line==='y=x'?[p[1],p[0]]:o.line==='y=-x'?[-p[1],-p[0]]:o.line[0]==='x'?[2*o.at-p[0],p[1]]:[p[0],2*o.at-p[1]]);
  if(k==='rotate'){const a=deg(o.ang),c=o.c;img=sh.map(p=>{const dx=p[0]-c[0],dy=p[1]-c[1];return[r2(c[0]+dx*Math.cos(a)-dy*Math.sin(a)),r2(c[1]+dx*Math.sin(a)+dy*Math.cos(a))];});}
  if(k==='enlarge'){const c=o.c;img=sh.map(p=>[c[0]+o.sf*(p[0]-c[0]),c[1]+o.sf*(p[1]-c[1])]);}
  let s=`<path d="${poly(sh)}" class="fade" style="fill:var(--v1);fill-opacity:.25;stroke:var(--v1);stroke-width:2.5"/>`+txt(P.sx(sh[0][0])-10,P.sy(sh[0][1])-10,o.on||'A',{c:'v1',s:13,w:800});
  // animated ghost moving from object to image
  let tf='';
  if(k==='translate')tf=`translate(${r2(P.sx(o.v[0])-P.sx(0))}px,${r2(P.sy(o.v[1])-P.sy(0))}px)`;
  if(k==='rotate')tf=`rotate(${-o.ang}deg)`;
  if(k==='enlarge')tf=`scale(${o.sf})`;
  const origin=k==='rotate'||k==='enlarge'?`${r2(P.sx(o.c[0]))}px ${r2(P.sy(o.c[1]))}px`:'0 0';
  if(k==='reflect'){
    if(o.line==='y=x'||o.line==='y=-x'){s+=`<path d="${poly(img)}" class="pop" style="--d:1.2s;fill:var(--v2);fill-opacity:.3;stroke:var(--v2);stroke-width:2.5"/>`;}
    else{const vert=o.line[0]==='x';const ox=vert?P.sx(o.at):0,oy=vert?0:P.sy(o.at);
      s+=`<path d="${poly(sh)}" class="mv" style="--d:.8s;--to:${vert?'scaleX(-1)':'scaleY(-1)'};transform-origin:${r2(ox)}px ${r2(oy)}px;transform-box:view-box;fill:var(--v2);fill-opacity:.3;stroke:var(--v2);stroke-width:2.5"/>`;}
    const ml=o.line==='y=x'?[[-5,-5],[5,5]]:o.line==='y=-x'?[[-5,5],[5,-5]]:o.line[0]==='x'?[[o.at,P.y0],[o.at,P.y1]]:[[P.x0,o.at],[P.x1,o.at]];
    s+=pth(`M${P.sx(ml[0][0])} ${P.sy(ml[0][1])}L${P.sx(ml[1][0])} ${P.sy(ml[1][1])}`,{c:'v4',w:2.4,dash:'7 5',cls:'',d:.4})+txt(P.sx(ml[1][0])-24,P.sy(ml[1][1])+14,o.line==='y=x'||o.line==='y=-x'?o.line:(o.line[0]==='x'?'x = '+o.at:'y = '+o.at),{c:'v4',s:12.5,w:800});
  }else{
    s+=`<path d="${poly(sh)}" class="mv" style="--d:.8s;--to:${tf};transform-origin:${origin};transform-box:view-box;fill:var(--v2);fill-opacity:.3;stroke:var(--v2);stroke-width:2.5"/>`;
  }
  s+=`<path d="${poly(img)}" class="fade" style="--d:2.3s;fill:none;stroke:var(--v2);stroke-width:2;stroke-dasharray:5 4"/>`;
  if(o.c)s+=`<circle cx="${P.sx(o.c[0])}" cy="${P.sy(o.c[1])}" r="5" style="fill:var(--v4)"/>`+txt(P.sx(o.c[0])+14,P.sy(o.c[1])+14,'centre',{c:'v4',s:11.5,w:700});
  if(k==='enlarge'&&o.rays)sh.forEach((p,i)=>{s+=pth(`M${P.sx(o.c[0])} ${P.sy(o.c[1])}L${P.sx(img[i][0])} ${P.sy(img[i][1])}`,{c:'mut',w:1.4,dash:'4 4',d:2+i*.15});});
  s+=txt(P.sx(img[0][0])+12,P.sy(img[0][1])-12,o.in||"A′",{c:'v2',s:13,w:800,cls:'fade',d:2.1});
  P.raw(s);return P.svg({mw:o.mw||400});
}

corr:{c:[['r','strength / direction',-10,10,1,7]],r(v,seed){let s=seed||11;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};const k=v.r/10;const pts=[];for(let i=0;i<22;i++){const x=.5+rnd()*9;const y=5+k*(x-5)*.9+(rnd()-.5)*(1-Math.abs(k))*9;pts.push([x,Math.max(0.2,Math.min(9.8,y))]);}
  const mx=pts.reduce((a,p)=>a+p[0],0)/22,my=pts.reduce((a,p)=>a+p[1],0)/22;let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p[0]-mx)*(p[1]-my);sxx+=(p[0]-mx)**2;});const b=sxy/sxx;
  return`<div class="wout">${Math.abs(k)<.25?'No correlation':(k>0?'Positive':'Negative')+' correlation'+(Math.abs(k)>.75?' (strong)':' (weak)')}</div>${scatterSVG({pts,fit:Math.abs(k)>=.25?[b,my-b*mx]:null,mean:[mx,my]}).replace(/class="(draw|pop|fade)"/g,'')}<div class="wnote">The line of best fit passes through the mean point (x̄, ȳ) = (${fmt(mx,1)}, ${fmt(my,1)}) with points spread evenly on both sides.</div>`;}},
bearing:{c:[['b','bearing of B from A',0,359,1,65]],r(v){const back=(v.b+180)%360;return`<div class="wout">Bearing of B from A = ${String(v.b).padStart(3,'0')}°</div>${compass({b:v.b,label:'B'}).replace(/class="(draw|pop|fade)"/g,'')}<div class="wnote">Back bearing (A from B) = ${v.b} ${v.b<180?'+':'−'} 180 = <b>${String(back).padStart(3,'0')}°</b>. Always 3 figures, clockwise from North.</div>`;}},
dist:{c:[['x1','x₁',-5,5,1,-3],['y1','y₁',-5,5,1,-2],['x2','x₂',-5,5,1,3],['y2','y₂',-5,5,1,4]],r(v){const P=Plot({w:420,h:320,x:[-6,6],y:[-6,6]});P.grid(1,2);const dx=v.x2-v.x1,dy=v.y2-v.y1;
  P.seg([v.x1,v.y1],[v.x2,v.y1],{c:'v3',cls:'',dash:'6 4',label:'Δx = '+dx,lo:[0,16]});P.seg([v.x2,v.y1],[v.x2,v.y2],{c:'v4',cls:'',dash:'6 4',label:'Δy = '+dy,lo:[30,0]});P.seg([v.x1,v.y1],[v.x2,v.y2],{c:'v1',w:3,cls:''});P.pt(v.x1,v.y1,{c:'v1',cls:'',label:`(${v.x1}, ${v.y1})`,ly:16});P.pt(v.x2,v.y2,{c:'v1',cls:'',label:`(${v.x2}, ${v.y2})`});P.pt((v.x1+v.x2)/2,(v.y1+v.y2)/2,{c:'v2',cls:'',label:'M',lx:-14,ly:-10});
  return`<div class="wout">Length = √(${dx}² + ${dy}²) = ${fmt(Math.hypot(dx,dy),3)}</div>${P.svg()}<div class="wstats"><span>Gradient = <b>${dx?dy+'/'+dx+' = '+fmt(dy/dx,3):dy?'vertical line (no gradient)':'same point — move one'}</b></span><span>Midpoint = <b>(${fmt((v.x1+v.x2)/2,1)}, ${fmt((v.y1+v.y2)/2,1)})</b></span><span>Perp. gradient = <b>${dy&&dx?fmt(-dx/dy,3):'—'}</b></span></div>`;}},
trigeq:{c:[['f','function',0,2,1,0,['sin','cos','tan']],['k','k',-1,1,.05,.5]],r(v){const fn=['sin','cos','tan'][v.f];const k=fn==='tan'?v.k*3:v.k;const f=fn==='sin'?Math.sin:fn==='cos'?Math.cos:Math.tan;

function mountWidget(host,name){
  const W=WIDGETS[name];if(!W){host.textContent='Missing widget '+name;return;}
  const vals={};let seed=7;
  host.innerHTML=`<div class="wctrl"></div><div class="wview"></div>`;
  const ctrl=host.querySelector('.wctrl'),view=host.querySelector('.wview');
  W.c.forEach(([id,label,min,max,step,val,opts])=>{vals[id]=val;
    const row=document.createElement('label');row.className='wrow';
    if(opts){row.innerHTML=`<span>${label}</span><div class="seg">${opts.map((o,i)=>`<button type="button" data-i="${i}" class="${i===val?'on':''}">${o}</button>`).join('')}</div>`;
      row.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.preventDefault();vals[id]=+b.dataset.i;row.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw();});}
    else{row.innerHTML=`<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><b>${fmt(val)}</b>`;
      const inp=row.querySelector('input'),out=row.querySelector('b');inp.oninput=()=>{vals[id]=+inp.value;out.textContent=fmt(+inp.value);draw();};}
    ctrl.appendChild(row);});
  if(name==='coin'||name==='corr'){const b=document.createElement('button');b.className='btn sm';b.innerHTML=ico('refresh')+' Run again';b.onclick=()=>{seed=Math.floor(Math.random()*1e6)+1;draw();};ctrl.appendChild(b);}
  function draw(){view.innerHTML=W.r(vals,seed);}
  draw();
}

const gridMul=(rowH,colH,cells,res)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:10px"><table class="ltable" style="font-family:var(--mono);font-size:17px"><tr><th>×</th>${colH.map(c=>`<th>${c}</th>`).join('')}</tr>${rowH.map((r,i)=>`<tr><th>${r}</th>${cells[i].map((c,j)=>`<td class="pop" style="--d:${.3+(i*colH.length+j)*.35}s;font-weight:700;color:var(--v${(i*colH.length+j)%4+1})">${c}</td>`).join('')}</tr>`).join('')}</table>${res?`<div class="mathline fade" style="--d:${.4+rowH.length*colH.length*.35}s;font-weight:800">${res}</div>`:''}</div>`;

LS('alg:0','E2.2','( )( )','Expanding means multiplying out brackets. Every term in one bracket multiplies every term in the other — the grid method makes sure you never miss one.',[
 I('Single brackets',[
  `Multiply the outside term by EVERY term inside: 3x(2x − 4y) = <b>6x² − 12xy</b>`,
  `Watch negatives: −2(x − 5) = −2x + 10`,
  `Expand and simplify: 3(x + 2) − 2(x − 1) = 3x + 6 − 2x + 2 = <b>x + 8</b>`,
  `“Simplify” = collect like terms: 2a² + 3ab − 1 + 5a² − 9ab + 4 = 7a² − 6ab + 3`]),
 VS('Double brackets — the grid method',gridMul(['2x','+1'],['x','−4'],[['2x²','−8x'],['x','−4']],'2x² − 8x + x − 4 = 2x² − 7x − 4'),`<ul class="blist"><li>Write one bracket along the top, one down the side.</li><li>Fill each box by multiplying.</li><li>Add everything, collecting the x terms.</li><li>FOIL (First, Outer, Inner, Last) does the same job.</li></ul>`,'(2x + 1)(x − 4)'),
 FM('Three special products','(a + b)² = a² + 2ab + b²<br>(a − b)² = a² − 2ab + b²<br>(a + b)(a − b) = a² − b²',[['2ab','the middle term — the most forgotten term in the exam'],['a² − b²','“difference of two squares” — the middle terms cancel']]),
 EX('Squaring a bracket','Expand (3x + 4)².',['Write it twice: (3x + 4)(3x + 4)','3x × 3x = 9x²','3x × 4 + 4 × 3x = 24x','4 × 4 = 16'],'9x² + 24x + 16'),
 EX('Two variables [Extended]','Expand (3x + y)(x − 4y).',['3x × x = 3x²','3x × (−4y) = −12xy','y × x = xy','y × (−4y) = −4y²','Collect: −12xy + xy = −11xy'],'3x² − 11xy − 4y²'),
 EX('Three brackets [Extended — syllabus example]','Expand (x − 2)(x + 3)(2x + 1).',['First two: (x − 2)(x + 3) = x² + x − 6','Now (x² + x − 6)(2x + 1)','= 2x³ + x² + 2x² + x − 12x − 6','Collect like terms'],'2x³ + 3x² − 11x − 6'),
 MI([['(x + 3)² = x² + 9','x² + 6x + 9','You must multiply the bracket by itself — 2 × x × 3 = 6x.'],['−(x − 4) = −x − 4','−x + 4','The minus multiplies EVERY term.'],['(x + 2)(x + 5) = x² + 7x + 7','x² + 7x + 10','Last terms MULTIPLY: 2 × 5 = 10.']]),
 Q('Expand (x − 5)(x + 5).',['x² − 25','x² − 10x − 25','x² + 25','x² − 10x + 25'],0,'Difference of two squares: the ±5x terms cancel.'),
 N('Expand and simplify (2x − 3)(x + 5). Type like 2x^2+7x-15',{expr:'2x^2+7x-15',v:'x',show:'2x² + 7x − 15'},'2x² + 10x − 3x − 15 = 2x² + 7x − 15.',null,'2x^2 + ...'),
 S('Every term × every term — use a grid if unsure.','(a ± b)² = a² ± 2ab + b² — never forget 2ab.','(a + b)(a − b) = a² − b².','Three brackets: expand two, then multiply by the third.')
]);

 EX('Quadratic with a = 1','Factorise x² − x − 12.',['Need two numbers: multiply to −12, add to −1','Try pairs: −4 and +3 ✓ (−4 × 3 = −12, −4 + 3 = −1)'],'(x − 4)(x + 3)'),
 EX('Quadratic with a ≠ 1 (split the middle)','Factorise 6x² + 7x − 3.',['ac = 6 × (−3) = −18; need × −18 and + 7 → 9 and −2','Split: 6x² + 9x − 2x − 3','Group: 3x(2x + 3) − 1(2x + 3)','Common bracket (2x + 3)'],'(3x − 1)(2x + 3)'),
 EX('Cubic [Extended]','Factorise completely x³ − 5x² + 6x.',['Common factor x: x(x² − 5x + 6)','Two numbers: × 6, + (−5) → −2 and −3'],'x(x − 2)(x − 3)'),
 MI([['4x² − 9 = (4x − 3)(x + 3)','(2x − 3)(2x + 3)','4x² is (2x)².'],['6x + 9 = 3(2x + 9)','3(2x + 3)','Divide EVERY term by the common factor.'],['2x² + 6x = 2(x² + 3x)','2x(x + 3)','“Fully” — x is also a common factor.']]),
 Q('Factorise x² + 2x − 15.',['(x + 5)(x − 3)','(x − 5)(x + 3)','(x + 15)(x − 1)','(x + 5)(x + 3)'],0,'5 × (−3) = −15 and 5 + (−3) = 2.'),
 Q('Factorise 16x² − 81y².',['(4x − 9y)²','(4x + 9y)(4x − 9y)','(16x + 81y)(x − y)','(8x − 9y)(2x + 9y)'],1,'(4x)² − (9y)² is a difference of two squares.'),
 S('Always take out the HCF first.','Four terms → group in pairs.','x² + bx + c → numbers × c, + b.','ax² + bx + c → split the middle using ac.','a² − b² = (a + b)(a − b).')
]);

LS('alg:2','E2.3','a/b','Algebraic fractions follow exactly the same rules as number fractions. The secret weapon: factorise first, then cancel whole brackets.',[
 I('The four rules — same as numbers',[
  `${B('Add/subtract')}: common denominator. ${F('x',3)} + ${F('x − 4',2)} = ${F('2x + 3(x − 4)',6)} = ${F('5x − 12',6)}`,
  `${B('Multiply')}: tops × tops, bottoms × bottoms. ${F('3a',4)} × ${F('9a',10)} = ${F('27a²',40)}`,
  `${B('Divide')}: flip the second, then multiply. ${F('3a',4)} ÷ ${F('9a',10)} = ${F('3a',4)} × ${F(10,'9a')} = ${F(5,6)}`,
  `${B('Simplify')}: factorise top and bottom, cancel common FACTORS.`]),
 EX('Simplify [syllabus example]',`Simplify ${F('x² − 2x','x² − 5x + 6')}`,['Factorise the top: x(x − 2)','Factorise the bottom: (x − 2)(x − 3)',`Cancel (x − 2): ${F('x','x − 3')}`],'x / (x − 3)'),
 EX('Subtracting',`Write ${F('2x',3)} − ${F('3(x − 5)',2)} as a single fraction.`,['Common denominator 6',`${F('4x',6)} − ${F('9(x − 5)',6)}`,'Numerator: 4x − 9x + 45 (careful: −9 × −5 = +45)'],'(45 − 5x)/6'),
 EX('Algebraic denominators',`Write ${F(1,'x − 2')} + ${F('x + 1','x − 3')} as a single fraction.`,['Common denominator (x − 2)(x − 3)','Numerator: 1(x − 3) + (x + 1)(x − 2)','= x − 3 + x² − x − 2'],'(x² − 5) / ((x − 2)(x − 3))'),
 MI([[`${F('x + 3',3)} = x`,`${F('x + 3',3)} can’t be cancelled like that`,'Only cancel whole FACTORS, never single terms.'],[`${F(1,'x')} + ${F(1,'y')} = ${F(2,'x + y')}`,F('x + y','xy'),'Use a common denominator.'],['−3(x − 5) = −3x − 15','−3x + 15','Brackets with a minus in front: every sign changes.']]),
 Q(`Simplify ${F('x² − 9','x + 3')}.`,['x − 3','x − 9','x + 3','x² − 3'],0,'x² − 9 = (x + 3)(x − 3) → cancel (x + 3).'),
 N(`Simplify ${F('3a',4)} ÷ ${F('9a',10)}. Give your answer as a fraction.`,5/6,'3a/4 × 10/(9a) = 30a/36a = 5/6.'),
 S('Factorise first, cancel whole brackets.','Add/subtract: common denominator; expand the numerator carefully.','Divide = flip and multiply.','A minus sign before a fraction changes every sign in its numerator.')
]);

LS('alg:3','E2.4','x⁻ⁿ','The index laws work with letters exactly as with numbers. Combine them with algebra to simplify expressions and solve equations with unknown powers.',[

 EX('Syllabus examples','Simplify (a) (5x³)²  (b) 12a⁵ ÷ 3a⁻²  (c) 6x⁷y⁴ × 5x⁻⁵y',['(a) 5² = 25, (x³)² = x⁶ → <b>25x⁶</b>','(b) 12 ÷ 3 = 4, a⁵ ÷ a⁻² = a⁵⁻⁽⁻²⁾ = a⁷ → <b>4a⁷</b>','(c) 6 × 5 = 30, x⁷ × x⁻⁵ = x², y⁴ × y = y⁵ → <b>30x²y⁵</b>'],'25x⁶ · 4a⁷ · 30x²y⁵'),
 EX('Fractional powers [Extended]','Simplify (8x⁶)<sup>2/3</sup>.',['Cube root first: ∛8 = 2, (x⁶)<sup>1/3</sup> = x²','So (8x⁶)<sup>1/3</sup> = 2x²','Then square: (2x²)²'],'4x⁴'),
 I('Solving equations with powers',[
  `Write both sides as powers of the SAME base, then equate the powers.`,
  `2ˣ = 32 → 2ˣ = 2⁵ → <b>x = 5</b>`,
  `[Ext] 32ˣ = 2 → (2⁵)ˣ = 2¹ → 5x = 1 → <b>x = ${F(1,5)}</b>`,
  `[Ext] 5ˣ⁺¹ = 25ˣ → 5ˣ⁺¹ = 5²ˣ → x + 1 = 2x → <b>x = 1</b>`]),
 MI([['(3x²)³ = 3x⁶','27x⁶','The number is cubed too.'],['x³ × x⁴ = x¹²','x⁷','Multiplying → ADD powers.'],['2x⁻³ = 1/(2x³)','2/x³','The power only belongs to x.']]),
 Q('Simplify 20x⁸ ÷ 4x².',['5x⁶','5x⁴','16x⁶','80x¹⁰'],0,'20 ÷ 4 = 5 and 8 − 2 = 6.'),
 N('Solve 3ˣ = 81.',4,'81 = 3⁴.'),
 N('Solve 4ˣ = 8. Give your answer as a fraction or decimal.',1.5,'4ˣ = (2²)ˣ = 2²ˣ and 8 = 2³, so 2x = 3 → x = 3/2.'),
