]);

LS('alg:4','E2.5','x = ?','Solving equations means finding the value that makes both sides equal. Do the same thing to both sides — and always check.',[
 I('Substitution & building expressions (E2.1)',[
  `Letters stand for numbers. Replace each letter with its value — use brackets for negatives.`,
  `v = u + at with u = 5, a = −2, t = 3 → v = 5 + (−2)(3) = <b>−1</b>`,
  `3x² − 2xy when x = −2, y = 5 → 3(4) − 2(−2)(5) = 12 + 20 = <b>32</b>`,
  `Construct: “the product of two consecutive even numbers” → 2n(2n + 2)`,
  `“A number that is 2 more than n” → n + 2; “three times the sum of a and b” → 3(a + b)`]),
 I('Linear equations',[
  `Expand brackets → collect x on one side → numbers on the other → divide.`,
  `Prefer to collect x where the coefficient stays positive.`,
  `Fractions: multiply every term by the common denominator first.`,
  `Construct equations from words: “the product of two consecutive even numbers” = 2n(2n + 2)`]),
 EX('Syllabus example','Solve 5 − 2x = 3(x + 7).',['Expand: 5 − 2x = 3x + 21','Add 2x: 5 = 5x + 21','Subtract 21: −16 = 5x','Divide by 5'],'x = −3.2'),
 FM('Simultaneous equations','Elimination: make one coefficient match, then + or −<br>Substitution: replace one letter using the other equation',[['same signs','subtract the equations'],['different signs','add the equations'],['check','substitute BOTH values into the OTHER equation']]),
 EX('Elimination','Solve 3x + 2y = 12 and 5x − 2y = 4.',['The y terms are +2y and −2y → ADD: 8x = 16','x = 2','Substitute: 3(2) + 2y = 12 → 2y = 6 → y = 3','Check: 5(2) − 2(3) = 4 ✓'],'x = 2, y = 3',(()=>{const P=Plot({w:340,h:280,x:[-1,6],y:[-2,7]});P.grid(1,2);P.fn(x=>(12-3*x)/2,{c:'v1',label:[0.2,6.6,'3x + 2y = 12','start']});P.fn(x=>(5*x-4)/2,{c:'v2',d:.5,label:[4.6,6.6,'5x − 2y = 4']});P.pt(2,3,{c:'v4',label:'(2, 3)',d:1.3,lx:26,ly:4});return P.svg();})()),
 EX('Constructing simultaneous equations','2 adult tickets and 3 child tickets cost $31. 1 adult and 2 child tickets cost $18. Find the price of each.',['Let a = adult, c = child: 2a + 3c = 31 and a + 2c = 18','Double the second: 2a + 4c = 36','Subtract the first: c = 5','a + 10 = 18 → a = 8'],'Adult $8, child $5'),
 I('Using the GDC [Extended]',[
  `Any equation can be solved by graphing BOTH sides and finding the intersection.`,
  `e.g. 2x − 1 = ${F(1,'x + 3')}: graph y = 2x − 1 and y = 1/(x + 3) → intersect.`,
  `Simultaneous equations: rearrange both into y = … and intersect.`,
  `Write down what you graphed — the method earns marks.`]),
 MI([['5 − 2x = 3x + 21 → 3x = 16','−16 = 5x','Moving −2x to the right makes +2x.'],['Elimination with +2y and −2y → subtract','ADD them','Different signs → add.']]),
 Q('Solve 4(x − 3) = 2x + 6.',['x = 9','x = 3','x = −9','x = 1.5'],0,'4x − 12 = 2x + 6 → 2x = 18 → x = 9.'),
 N('Solve x + y = 10 and x − y = 4. Give x first, e.g. 7, 3',{pair:[7,3]},'Add: 2x = 14 → x = 7, y = 3.',null,'x, y'),
 S('Do the same to both sides; expand brackets first.','Simultaneous: eliminate or substitute; check in the other equation.','Graphically: the solution is the intersection point.','Write the equation from words before solving.')
]);

LS('alg:5','E2.5','ax²','Quadratic equations have up to two solutions. Three methods: factorise, formula, or GDC — choose the quickest one each time.',[
 I('Method 1 — factorise',[
  `Rearrange to = 0 first!`,
  `x² − x − 12 = 0 → (x − 4)(x + 3) = 0`,
  `If two things multiply to 0, one of them is 0: x − 4 = 0 or x + 3 = 0`,
  `<b>x = 4 or x = −3</b>`]),
 FM('Method 2 — the quadratic formula (given)','x = <span class="frac"><span>−b ± √(b² − 4ac)</span><span>2a</span></span>',[['use when','it won’t factorise, or you need surd / decimal answers'],['−b','means the OPPOSITE sign of b'],['±','gives two answers — write both']]),
 EX('Using the formula','Solve 2x² − 5x − 1 = 0. Give answers in surd form and to 2 d.p.',['a = 2, b = −5, c = −1','b² − 4ac = 25 + 8 = 33','x = (5 ± √33) / 4','x = 2.69 or x = −0.19'],'x = (5 ± √33)/4'),
 W('See the roots on the graph','quad','Roots are where the parabola crosses the x-axis — move it until it misses the axis completely.'),
 FM('The discriminant b² − 4ac','b² − 4ac &gt; 0 → 2 roots &nbsp;&nbsp; = 0 → 1 root &nbsp;&nbsp; &lt; 0 → no real roots',[['> 0','crosses the x-axis twice'],['= 0','touches the x-axis'],['< 0','misses the x-axis']]),
 EX('Constructing a quadratic','A rectangle has width x cm and length (x + 3) cm. Its area is 40 cm². Find x.',['x(x + 3) = 40','x² + 3x − 40 = 0','(x + 8)(x − 5) = 0','x = −8 (impossible: a length) or x = 5'],'x = 5'),
 MI([['x² = 5x → x = 5','x² − 5x = 0 → x(x − 5) = 0 → x = 0 or 5','Never divide by x — you lose a solution.'],['b = −5 → −b = −5','−b = +5','The formula uses the opposite of b.'],['(x − 4)(x + 3) = 0 → x = −4 or 3','x = 4 or −3','Each bracket = 0, so the signs flip.']]),
 Q('How many real roots does x² + 4x + 7 = 0 have?',['0','1','2','infinitely many'],0,'b² − 4ac = 16 − 28 = −12 < 0.'),
 N('Solve x² − 7x + 10 = 0. Give both answers separated by a comma.',{set:[2,5]},'(x − 2)(x − 5) = 0.',null,'e.g. 2, 5'),
 S('Rearrange to ax² + bx + c = 0 first.','Factorise if you can; otherwise use the formula (it’s given).','b² − 4ac tells you how many roots.','Reject answers that make no sense in context (negative lengths).')
]);

LS('alg:6','E2.5.3','÷x','Fractional equations have x in the denominator. Multiply EVERY term by the denominators to clear them — then it’s a normal linear or quadratic equation.',[
 I('The method',[
  `Find the LCM of all the denominators.`,
  `Multiply EVERY term (both sides) by it.`,
  `Solve the resulting linear or quadratic equation.`,
  `Check: reject any answer that makes a denominator zero.`]),
 EX('Syllabus example 1',`Solve ${F('x','2x + 1')} = 4.`,['Multiply both sides by (2x + 1): x = 4(2x + 1)','x = 8x + 4','−7x = 4'],'x = −4/7'),
 EX('Syllabus example 2',`Solve ${F(2,'x + 2')} + ${F(3,'2x − 1')} = 1.`,['Multiply every term by (x + 2)(2x − 1)','2(2x − 1) + 3(x + 2) = (x + 2)(2x − 1)','7x + 4 = 2x² + 3x − 2','2x² − 4x − 6 = 0 → x² − 2x − 3 = 0','(x − 3)(x + 1) = 0'],'x = 3 or x = −1'),
 EX('Cross-multiplying',`Solve ${F('x','x + 2')} = ${F(3,'x − 6')}.`,['Cross-multiply: x(x − 6) = 3(x + 2)','x² − 6x = 3x + 6','x² − 9x − 6 = 0','Formula: x = (9 ± √105)/2'],'x = 9.62 or x = −0.623'),
 MI([['x/3 + 2 = 5 → x + 2 = 15','x + 6 = 15','Multiply EVERY term by 3, including the 2.'],['Forgetting brackets: 2(x + 2) written as 2x + 2','2x + 4','Keep the denominator in brackets when multiplying.']]),
 Q(`Solve ${F(12,'x')} = 3.`,['x = 4','x = 36','x = 9','x = 1/4'],0,'12 = 3x → x = 4.'),
 N(`Solve ${F('x + 1',3)} − ${F('x − 1',4)} = 2.`,17,'× 12: 4(x + 1) − 3(x − 1) = 24 → x + 7 = 24 → x = 17.'),
 S('Multiply every term by the LCM of the denominators.','Use brackets when multiplying expressions.','You may get a quadratic — solve it.','Check no denominator becomes 0.')
]);

LS('alg:7','E2.5.6','y→x','Rearranging a formula is solving an equation with letters. Undo operations in reverse order — and if the subject appears twice, factorise.',[
 EX('Subject appears once','Make t the subject of v = u + at.',['Subtract u: v − u = at','Divide by a'],'t = (v − u)/a'),
 I('Undo in reverse order (BIDMAS backwards)',[
  `Deal with + and − first, then × and ÷, then powers/roots.`,
  `Square root → square both sides; square → square-root both sides.`,
  `Fractions → multiply both sides by the denominator.`]),
 EX('Subject appears twice [Extended]','Make x the subject of ax + b = cx + d.',['Get both x terms on one side: ax − cx = d − b','Factorise out x: x(a − c) = d − b','Divide by (a − c)'],'x = (d − b)/(a − c)'),
 EX('Subject in a fraction [Extended]',`Make x the subject of y = ${F('x + 3','x − 2')}.`,['Multiply up: y(x − 2) = x + 3','Expand: xy − 2y = x + 3','Collect x: xy − x = 2y + 3','Factorise: x(y − 1) = 2y + 3'],'x = (2y + 3)/(y − 1)'),
 EX('Roots and powers [Extended]','Make L the subject of T = 2π√(L/g).',['Divide by 2π: T/(2π) = √(L/g)','Square: T²/(4π²) = L/g','Multiply by g'],'L = gT²/(4π²)'),
 MI([['A = πr² → r = A/π²','r = √(A/π)','Undo the square with a square root.'],['x(a − c) = d − b → x = d − b/(a − c)','x = (d − b)/(a − c)','Use brackets for the whole numerator.']]),
 Q('Make r the subject of V = ⁴⁄₃πr³.',['r = ∛(3V/(4π))','r = 3V/(4π)','r = ∛(4πV/3)','r = √(3V/4π)'],0,'× 3, ÷ 4π, then cube root.'),
 Q('Make x the subject of 3x − k = mx + 5.',['x = (5 + k)/(3 − m)','x = (5 − k)/(3 − m)','x = (5 + k)/(3 + m)','x = 5 + k − 3 + m'],0,'3x − mx = 5 + k → x(3 − m) = 5 + k.'),
 S('Undo operations in reverse order.','Subject twice → collect them, factorise, divide.','Squares ↔ square roots; fractions → multiply up.','Brackets around numerators and denominators!')
]);

LS('alg:8','E2.6','≤','Inequalities describe a RANGE of values. Solve them like equations — with one crucial twist — and show them on number lines or graphs.',[
 I('Symbols and number lines',[
  `&lt; less than, &gt; greater than (strict) → <b>open circle ○</b>`,
  `≤ less than or equal, ≥ greater than or equal (inclusive) → <b>closed circle ●</b>`,
  `−3 ≤ x &lt; 1 means x is between −3 (included) and 1 (not included)`],
  nline({min:-5,max:4,ranges:[{from:-3,to:1,incL:true,incR:false,label:'−3 ≤ x < 1'}]})),
 W('Build an inequality','ineq','Change the ends and the circles. Which integers are included?'),
 I('Solving — the one twist',[
  `Solve exactly like an equation…`,
  `…BUT if you multiply or divide by a <b>negative</b> number, <b>flip the sign</b>.`,
  `−2x &lt; 6 → x &gt; −3`,
  `Check with a number: x = 0 → −2(0) = 0 &lt; 6 ✓ and 0 &gt; −3 ✓`]),
 EX('Double inequality [syllabus example]','Solve −3 ≤ 3x − 2 < 7.',['Add 2 to all three parts: −1 ≤ 3x < 9','Divide all parts by 3'],'−⅓ ≤ x < 3'),
 VS('Regions on a graph [Extended]',(()=>{const P=Plot({w:400,h:320,x:[-2,6],y:[-2,6]});P.grid(1,1);P.region([[-2,-2],[6,-2],[6,1],[-2,1]],{c:'v4',d:.8});P.region([[3,-2],[6,-2],[6,6],[3,6]],{c:'v4',d:1});P.region([[-2,-1],[6,7],[6,6],[-2,6]],{c:'v4',d:1.2});P.hline(1,{c:'v1',dash:'',w:2.6,cls:'draw'});P.vline(3,{c:'v2',dash:'7 5',w:2.6,cls:'draw'});P.fn(x=>x+1,{c:'v3',w:2.6});P.text(2.2,1.9,'R',{s:18,w:800,d:1.6});P.text(5,1.4,'y = 1',{c:'v1',s:12});P.text(3.6,5.6,'x = 3',{c:'v2',s:12});P.text(0.8,2.6,'y = x + 1',{c:'v3',s:12});return P.svg();})(),`<ul class="blist"><li><b>Solid</b> line for ≤ or ≥; <b>broken</b> line for &lt; or &gt;.</li><li>Shade the <b>UNWANTED</b> side (unless told otherwise).</li><li>Test a point like (0, 0) to decide which side.</li><li>Region R: y ≥ 1, x &lt; 3, y ≤ x + 1</li></ul>`),
 I('Solving with the GDC [Extended]',[
  `To solve e.g. x² &gt; 2x + 3: graph y = x² and y = 2x + 3.`,

  `Read where the first graph is ABOVE the second: <b>x &lt; −1 or x &gt; 3</b>.`]),

 Q('Solve 7 − 3x ≥ 19.',['x ≤ −4','x ≥ −4','x ≤ 4','x ≥ 4'],0,'−3x ≥ 12 → divide by −3 and flip → x ≤ −4.'),

 S('○ strict (<, >), ● inclusive (≤, ≥).','× or ÷ by a negative → flip the sign.','Graphs: solid for ≤ ≥, broken for < >; shade unwanted.','GDC: compare two graphs to read off the range.')
]);

LS('alg:9','E2.7','Tₙ','Sequences follow rules. Find the pattern with differences, then write the nth term so you can find ANY term instantly.',[
 C('Sequences to recognise',[['Square','1, 4, 9, 16, 25, … → n²'],['Cube','1, 8, 27, 64, 125, … → n³'],['Triangle','1, 3, 6, 10, 15, … → n(n + 1)/2'],['Linear','constant first difference'],['Quadratic','constant second difference'],['Exponential [Ext]','constant RATIO: 3, 6, 12, 24 → 3 × 2ⁿ⁻¹']]),
 VS('The difference method',seqDiff([3,8,15,24,35],{second:true}),`<ul class="blist"><li>1st differences 5, 7, 9, 11 — not constant.</li><li>2nd differences 2, 2, 2 — constant → <b>quadratic</b>.</li><li>a = 2nd difference ÷ 2 = 1 → starts with n².</li><li>3, 8, 15… minus n² (1, 4, 9…) = 2, 4, 6 = 2n</li><li>Tₙ = <b>n² + 2n</b></li></ul>`),
 EX('Linear nth term','Find the nth term of 7, 11, 15, 19, …',['Difference = 4 → 4n','4n gives 4, 8, 12, 16 — each term is 3 more'],'Tₙ = 4n + 3'),
 EX('Quadratic [syllabus example]','Find the nth term of 2, 5, 10, 17, …',['1st differences: 3, 5, 7 → 2nd differences 2, 2','a = 2 ÷ 2 = 1 → n²: 1, 4, 9, 16','Remainder: 1, 1, 1, 1'],'Tₙ = n² + 1'),
 EX('Cubic [Extended]','Find the nth term of 2, 9, 28, 65, 126, …',['1st: 7, 19, 37, 61 · 2nd: 12, 18, 24 · 3rd: 6, 6','3rd difference = 6a → a = 1 → n³: 1, 8, 27, 64, 125','Remainder: 1 each time'],'Tₙ = n³ + 1'),

  `Relationships: Tₙ = 4, 7, 10, 13 (3n + 1) and Uₙ = 16, 49, 100, 169 → <b>Uₙ = (Tₙ)²</b>`,
  `Subscript notation: T₅ means the 5th term of sequence T.`]),
 W('Build a sequence','seq','Set a, b, c in an² + bn + c and watch the differences.'),
 MI([['nth term of 5, 8, 11 is n + 3','3n + 2','The difference (3) is the coefficient of n.'],['Quadratic: a = 2nd difference','a = 2nd difference ÷ 2','Because n² has 2nd difference 2.']]),
 Q('Next term of 2, 6, 18, 54, …?',['162','108','72','58'],0,'×3 each time (exponential).'),

LS('alg:10','E2.8','∝','Proportion describes how one quantity changes with another. Write y = k × (something), find k, then use it.',[
 C('The proportion family',[['y ∝ x','y = kx (straight line through origin)'],['y ∝ x²','y = kx²'],['y ∝ x³','y = kx³'],['y ∝ √x','y = k√x'],['y ∝ 1/x','y = k/x (inverse)'],['y ∝ 1/x²','y = k/x² (inverse square)']]),
 VS('What the graphs look like',(()=>{const P=Plot({w:420,h:300,x:[0,5],y:[0,10],lab:1});P.grid(1,1,{ylab:2});P.fn(x=>2*x,{c:'v1',label:[4.6,9.6,'y = 2x']});P.fn(x=>0.4*x*x,{c:'v2',d:.4,label:[3.9,7.3,'y = 0.4x²']});P.fn(x=>3*Math.sqrt(x),{c:'v3',d:.8,label:[4.7,5.8,'y = 3√x']});P.fn(x=>4/x,{c:'v4',d:1.2,from:.3,label:[4.5,1.5,'y = 4/x']});return P.svg();})(),`<ul class="blist"><li>Direct proportion graphs pass through the origin.</li><li>Inverse: as x doubles, y halves.</li><li>Inverse square: as x doubles, y ÷ 4.</li></ul>`),
 FM('The 3-step method','① write the equation &nbsp; ② find k &nbsp; ③ use it',[['∝','the symbol means “is proportional to” — you must know it'],['k','the constant of proportionality']]),
 EX('Inverse square','y is inversely proportional to x². When x = 2, y = 5. Find y when x = 10.',['y = k/x²','5 = k/4 → k = 20','y = 20/x²','y = 20/100'],'y = 0.2'),
 EX('Direct, square root','p ∝ √q and p = 12 when q = 16. Find q when p = 21.',['p = k√q → 12 = 4k → k = 3','21 = 3√q → √q = 7'],'q = 49'),
 EX('Identify the best model','x: 1, 2, 3, 4 &nbsp;&nbsp; y: 3, 12, 27, 48. Which model fits?',['Try y/x: 3, 6, 9, 12 — not constant','Try y/x²: 3, 3, 3, 3 — constant ✓'],'y = 3x²  (y ∝ x²)'),
 MI([['y ∝ 1/x → y = x/k','y = k/x','k always goes on top.'],['Using the new values to find k','Use the GIVEN pair to find k first','Then substitute the new value.']]),
 Q('y ∝ x³. If x is doubled, y is multiplied by…',['8','2','6','3'],0,'2³ = 8.'),
 N('y ∝ x and y = 14 when x = 4. Find y when x = 10.',35,'k = 3.5 → y = 35.'),
 S('Write y = k × (expression), find k from the given pair, then use it.','Direct graphs go through (0, 0).','Doubling x: y ∝ x² → ×4; y ∝ 1/x → ÷2; y ∝ 1/x² → ÷4.','Best model: test which ratio y/f(x) is constant.')
]);

const mini=(f,label,c,o={})=>{const P=Plot({w:200,h:160,x:o.x||[-4,4],y:o.y||[-4,4],pad:12});P.grid(1,0);(o.asym||[]).forEach(a=>a[0]==='x'?P.vline(a[1],{c:'bad',w:1.4}):P.hline(a[1],{c:'bad',w:1.4}));P.fn(f,{c,w:3,n:500});return`<div style="display:flex;flex-direction:column;align-items:center;gap:2px">${P.svg({mw:200})}<b style="font-size:13px">${label}</b></div>`;};
const miniGrid=items=>`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%">${items.join('')}</div>`;

LS('func:0','E3.1','f(x)','You must recognise every function type from the SHAPE of its graph — and read off key values like intercepts, period and amplitude.',[
 VS('The function family',miniGrid([mini(x=>x-1,'Linear  ax + b','var(--v1)'),mini(x=>x*x-3,'Quadratic  ax² + bx + c','var(--v2)'),mini(x=>x*x*x/3-x,'Cubic  ax³ + …','var(--v3)'),mini(x=>2/x,'Reciprocal  a/x','var(--v4)',{asym:[['x',0],['y',0]]}),mini(x=>2**x-0,'Exponential  aˣ, a > 1','var(--v5)',{y:[-1,7],asym:[['y',0]]}),mini(x=>0.5**x,'Exponential  0 < a < 1','var(--v6)',{y:[-1,7],asym:[['y',0]]}),mini(x=>2*Math.sin(x*1.2),'a sin(bx) / a cos(bx)','var(--v1)'),mini(x=>Math.tan(x),'tan x','var(--v4)',{asym:[['x',-Math.PI/2],['x',Math.PI/2]]})]),null,'Memorise these eight shapes'),
 C('Key features to look for',[['Linear','constant gradient a; y-intercept b'],['Quadratic','∪ if a > 0, ∩ if a < 0; one turning point; line of symmetry'],['Cubic','up to 2 turning points; a > 0 rises left→right overall'],['Reciprocal','two branches; asymptotes x = 0 and y = 0; rotational symmetry'],['Exponential','passes through (0, 1) for aˣ; asymptote y = 0; never negative'],['Trig','amplitude |a|; period 360°/b (tan: 180°, asymptotes at 90°, 270°)']]),
 W('Explore cubics','cubic','Move the roots — the graph crosses the x-axis at each one.'),
 W('Explore reciprocal graphs','recip','The curve never touches its asymptotes.'),
 W('Sine, cosine & tangent','trig','Change a (amplitude) and b (period = 360° ÷ b).'),
 EX('Finding constants from a graph','The graph of y = a sin(bx) has maximum 3 and repeats every 120°. Find a and b.',['Amplitude = maximum = 3 → a = 3','Period = 360° ÷ b = 120°','b = 360 ÷ 120 = 3'],'y = 3 sin(3x)'),
 EX('Reading values','A quadratic y = x² + bx + c crosses the y-axis at −6 and has roots at x = −2 and x = 3. Find b and c.',['y-intercept → c = −6','y = (x + 2)(x − 3) = x² − x − 6','So b = −1'],'b = −1, c = −6'),
 Q('Which function has an asymptote at y = 0 and passes through (0, 1)?',['y = 3ˣ','y = 1/x','y = x² + 1','y = sin x'],0,'Any aˣ passes through (0, 1) because a⁰ = 1, and approaches y = 0.'),
 Q('What is the period of y = cos(4x)?',['90°','360°','4°','1440°'],0,'360° ÷ 4 = 90°.'),
 S('Linear, quadratic, cubic, reciprocal, exponential, sin, cos, tan — know each shape.','Amplitude = |a|, period = 360°/b.','aˣ goes through (0, 1); asymptote y = 0.','Use intercepts, turning points and symmetry to find unknown constants.')
]);

LS('func:1','E3.2','GDC','Your TI-Nspire CX II is worth many marks on Papers 4 and 6 — sketching, tables, roots, turning points and intersections.',[
 C('Six GDC skills in the syllabus',[['(a) Sketch','Graphs page: type f1(x) = …; menu → Window/Zoom'],['(b) Table','ctrl + T on a Graphs page; menu → Table → Edit Table Settings'],['(c) Plot points','use the table to plot accurately'],['(d) Zeros & turning points','menu → Analyze Graph → Zero / Minimum / Maximum'],['(e) Intersections','menu → Analyze Graph → Intersection'],['(f) Vertex of a quadratic','MAX or MIN']]),
 EX('Analysing a cubic','Use your GDC to find the zeros and turning points of y = x³ − 3x + 1.',['Graphs page: f1(x) = x³ − 3x + 1, window −3 ≤ x ≤ 3','Analyze Graph → Zero (three times): x = −1.88, 0.347, 1.53','Analyze Graph → Maximum: (−1, 3)','Analyze Graph → Minimum: (1, −1)'],'3 roots, max (−1, 3), min (1, −1)',(()=>{const P=Plot({w:380,h:300,x:[-3,3],y:[-4,5]});P.grid(1,1);P.fn(x=>x**3-3*x+1,{c:'v1'});[-1.879,0.347,1.532].forEach((r,i)=>P.pt(r,0,{c:'v2',d:1+i*.2,s:2}));P.pt(-1,3,{c:'v4',label:'max (−1, 3)',s:3});P.pt(1,-1,{c:'v4',label:'min (1, −1)',ly:18,s:4});return P.svg();})()),
 EX('Solving an unfamiliar equation','Solve 2ˣ = x + 2.',['f1(x) = 2^x and f2(x) = x + 2','Analyze Graph → Intersection for each crossing','x = −1.69 and x = 2'],'x = −1.69 or x = 2',(()=>{const P=Plot({w:360,h:280,x:[-3,3],y:[-1,6]});P.grid(1,1);P.fn(x=>2**x,{c:'v1',label:[2.3,5.6,'y = 2ˣ']});P.fn(x=>x+2,{c:'v2',d:.4,label:[-2.2,0.6,'y = x + 2']});P.pt(-1.69,0.31,{c:'v4',d:1.2,s:3});P.pt(2,4,{c:'v4',d:1.4,s:3,label:'(2, 4)',lx:-28});return P.svg();})()),
 I('How to SKETCH a graph for marks',[
  `Correct overall shape across the given domain.`,
  `Mark and label intercepts with the axes.`,
  `Mark turning points (with coordinates if asked).`,
  `Show asymptotes as dashed lines, with the curve approaching them.`,
  `Draw it to fit the window given in the question (e.g. −3 ≤ x ≤ 3).`]),
 MI([['Writing only the answer from the GDC','Write what you graphed and which feature you used','Method marks need evidence.'],['Missing a root off-screen','Zoom out / check the whole domain','Sketch first to count the solutions.']]),
 Q('Which GDC feature finds the vertex of y = x² − 6x + 2?',['MIN','ROOT','ISCT','TABLE only'],0,'a > 0 → ∪ shape → the vertex is a minimum point.'),
 S('Sketch, table, plot, zero, max/min, intersection, vertex.','Any equation f(x) = g(x) → graph both and intersect.','Sketches: shape, intercepts, turning points, asymptotes.','Always state what you did on the GDC.')
]);

LS('func:2','E3.3','f:x↦','Function notation is a compact way to describe a rule. Domain = what goes in, range = what comes out.',[
 I('Function notation',[
  `f(x) = 3x − 5 means “f takes x, multiplies by 3, subtracts 5”.`,
  `f(4) = 3(4) − 5 = 7 &nbsp; (replace x with 4)`,
  `Solve f(x) = 13 → 3x − 5 = 13 → x = 6`,
  `h(x) = 2x² + 3: h(−2) = 2(4) + 3 = 11 — square BEFORE multiplying`]),
 VS('Mapping diagram',`<svg viewBox="0 0 360 200" class="viz" style="max-width:380px"><ellipse cx="80" cy="100" rx="45" ry="85" style="fill:var(--v1);fill-opacity:.1;stroke:var(--v1);stroke-width:2"/><ellipse cx="280" cy="100" rx="45" ry="85" style="fill:var(--v2);fill-opacity:.1;stroke:var(--v2);stroke-width:2"/>${[[-1,-8],[0,-5],[2,1],[4,7]].map((p,i)=>txt(80,40+i*40,p[0],{s:15,w:800})+txt(280,40+i*40,p[1],{s:15,w:800,c:'v2'})+pth(`M100 ${40+i*40}L255 ${40+i*40}`,{c:'mut',w:1.8,d:.3+i*.3})+arrowHead(240,40+i*40,258,40+i*40,'var(--v-mut)',8,{d:.9+i*.3})).join('')}${txt(80,8,'domain',{c:'v1',s:12})}${txt(280,8,'range',{c:'v2',s:12})}${txt(180,190,'f(x) = 3x − 5',{s:14,w:800,c:'v4'})}</svg>`,`<ul class="blist"><li>Each input maps to exactly ONE output.</li><li>Domain: allowed inputs.</li><li>Range: the outputs produced.</li></ul>`),
 C('Domain & range [Extended]',[['f(x) = 1/(x − 2)','domain x ≠ 2 (can’t divide by 0)'],['f(x) = √(x − 3)','domain x ≥ 3 (no square roots of negatives)'],['f(x) = x² + 1','range f(x) ≥ 1'],['f(x) = 2ˣ','range f(x) > 0']]),
 EX('Evaluating and solving','g(x) = 5 − 2x. Find (a) g(−3) (b) the value of x for which g(x) = 11.',['(a) g(−3) = 5 − 2(−3) = 5 + 6 = 11','(b) 5 − 2x = 11 → −2x = 6 → x = −3'],'g(−3) = 11; x = −3'),
 MI([['f(3) for f(x) = 2x² → (2 × 3)² = 36','2 × 3² = 18','Powers before multiplication.'],['f(x) = 7 means x = 7','Solve the equation f(x) = 7','f(x) is the OUTPUT.']]),
 Q('f(x) = x² − 4x. Find f(−1).',['5','−5','3','−3'],0,'(−1)² − 4(−1) = 1 + 4 = 5.'),
 N('h(x) = 2x² + 3. Find h(−4).',35,'2 × 16 + 3 = 35.'),
 S('f(a): replace x with a — use brackets for negatives.','f(x) = k: solve the equation.','Domain = inputs, range = outputs.','Watch for division by zero and square roots of negatives.')
]);

LS('func:3','E3.3','f⁻¹','Composite functions chain machines together; inverse functions run a machine backwards. Order matters!',[
 FM('Composite functions','gf(x) = g( f(x) )',[['order','do f FIRST — the letter closest to x'],['gf ≠ fg','in general the order changes the answer']]),
 VS('Two machines in a row',`<svg viewBox="0 0 520 140" class="viz" style="max-width:540px">${['x','f','g','gf(x)'].map((t,i)=>i===1||i===2?`<rect x="${40+i*120}" y="40" width="90" height="60" rx="14" class="pop" style="--d:${i*.4}s;fill:var(--v${i});fill-opacity:.18;stroke:var(--v${i});stroke-width:2.5"/>`+txt(85+i*120,70,t,{s:22,w:800,c:'v'+i,cls:'fade',d:i*.4}):txt(85+i*120,70,t,{s:18,w:800,cls:'fade',d:i*.4})).join('')}${[0,1,2].map(i=>pth(`M${110+i*120} 70H${155+i*120}`,{c:'mut',w:2,d:.3+i*.4})+arrowHead(140+i*120,70,158+i*120,70,'var(--v-mut)',9,{d:.6+i*.4})).join('')}${txt(260,125,'x goes into f first, then the result goes into g',{s:12.5,c:'mut',cls:'fade',d:1.6})}</svg>`),
 EX('Composite','f(x) = 3x + 1 and g(x) = x². Find (a) gf(x) (b) fg(2) (c) gf(2).',['(a) g(f(x)) = g(3x + 1) = (3x + 1)² = 9x² + 6x + 1','(b) g(2) = 4, then f(4) = 13','(c) f(2) = 7, then g(7) = 49'],'9x² + 6x + 1 · 13 · 49'),
 EX('Composite with fractions','f(x) = 2/(x + 3) and g(x) = 3x + 1. Find fg(x) and gf(x) as single fractions.',['fg(x) = f(3x + 1) = 2/(3x + 1 + 3) = 2/(3x + 4)','gf(x) = 3 × 2/(x + 3) + 1 = 6/(x + 3) + (x + 3)/(x + 3)','= (x + 9)/(x + 3)'],'fg(x) = 2/(3x + 4); gf(x) = (x + 9)/(x + 3)'),
 FM('Inverse functions','① y = f(x) &nbsp; ② swap x and y &nbsp; ③ make y the subject',[['f⁻¹','undoes f: if f(3) = 7 then f⁻¹(7) = 3'],['check','f(f⁻¹(x)) = x']]),
 EX('Finding an inverse','Find f⁻¹(x) for f(x) = (2x − 3)/5.',['y = (2x − 3)/5','Swap: x = (2y − 3)/5','5x = 2y − 3 → 2y = 5x + 3'],'f⁻¹(x) = (5x + 3)/2'),
 MI([['gf(x) means do g first','gf(x) = g(f(x)) → f first','Read from the right.'],['f⁻¹(x) = 1/f(x)','f⁻¹ is the inverse function, not the reciprocal','Use the swap method.']]),
 Q('f(x) = x − 4 and g(x) = 2x. Find fg(5).',['6','2','10','−3'],0,'g(5) = 10 first, then f(10) = 6.'),
 N('f(x) = 4x − 7. Find f⁻¹(5).',3,'f⁻¹(x) = (x + 7)/4 → (5 + 7)/4 = 3.'),
 S('gf(x) = g(f(x)): apply f first.','Inverse: y = f(x), swap x and y, rearrange.','f⁻¹ undoes f; graphs reflect in y = x.','You don’t need the domain/range of composite functions.')
]);

LS('func:4','E3.4','vertex','Given a few facts about a parabola — its vertex, or where it crosses the x-axis — you can find its exact equation.',[
 FM('Two useful forms','Vertex form: y = a(x − h)² + k &nbsp;→ vertex (h, k)<br>Root form: y = a(x − p)(x − q) &nbsp;→ roots p and q',[['h','x-coordinate of the vertex (note the minus sign!)'],['k','y-coordinate of the vertex'],['a','found by substituting one more point']]),
 W('Vertex form explorer','quad','Watch how h and k move the vertex, and a stretches or flips.'),
 EX('(a) Vertex and another point','Vertex (2, −3), passes through (0, 5). Find the equation.',['y = a(x − 2)² − 3','Substitute (0, 5): 5 = a(4) − 3','4a = 8 → a = 2','y = 2(x − 2)² − 3 = 2x² − 8x + 5'],'y = 2(x − 2)² − 3'),
 EX('(b) x-intercepts and a point','Crosses the x-axis at −1 and 4, passes through (0, −8).',['y = a(x + 1)(x − 4)','At (0, −8): −8 = a(1)(−4)','a = 2','y = 2(x² − 3x − 4)'],'y = 2x² − 6x − 8'),
 EX('(c) When a = 1','Write the equation of y = x² + bx + c with (i) vertex (−3, 4) (ii) roots 2 and −5.',['(i) y = (x + 3)² + 4 = x² + 6x + 13','(ii) y = (x − 2)(x + 5) = x² + 3x − 10'],'x² + 6x + 13 · x² + 3x − 10'),
 MI([['Vertex (2, −3) → y = a(x + 2)² − 3','y = a(x − 2)² − 3','The sign inside the bracket is opposite to h.'],['Roots −1 and 4 → (x − 1)(x + 4)','(x + 1)(x − 4)','Root p gives the factor (x − p).']]),
 Q('What is the vertex of y = 3(x + 5)² − 1?',['(−5, −1)','(5, −1)','(−5, 1)','(3, −1)'],0,'(x − h) = (x + 5) → h = −5; k = −1.'),
 N('A parabola y = a(x − 1)² + 2 passes through (3, 10). Find a.',2,'10 = a(4) + 2 → a = 2.'),
 S('Vertex (h, k) → y = a(x − h)² + k.','Roots p, q → y = a(x − p)(x − q).','Use one extra point to find a.','If a = 1 you need only the vertex or the roots.')
]);

LS('func:5','E3.5 · E3.6','↕↔','Asymptotes are lines a graph approaches but never reaches. Translations slide whole graphs up, down, left or right.',[
 C('Asymptotes you must know',[['y = a/x','x = 0 and y = 0'],['y = aˣ','y = 0 (horizontal)'],['y = tan x','x = 90°, 270°, … (vertical)'],['y = a/x + k','y = k (moved up/down)']]),
 W('Translate a graph','shift','Change k in f(x) + k and in f(x + k). Notice which way it moves!'),
 FM('The two translations','y = f(x) + k &nbsp;→ vector (0, k)<br>y = f(x + k) &nbsp;→ vector (−k, 0)',[['+ k outside','moves UP by k'],['+ k inside','moves LEFT by k (the opposite way!)']]),
 EX('Finding g(x) [syllabus style]','y = f(x) is mapped onto y = g(x) by a translation by vector (3, −2). f(x) = x². Find g(x).',['Right 3 → replace x with (x − 3)','Down 2 → subtract 2','g(x) = (x − 3)² − 2','Expand if asked: x² − 6x + 7'],'g(x) = (x − 3)² − 2'),
 EX('Describing a transformation','Describe fully the transformation that maps y = 2ˣ onto y = 2ˣ⁺⁴.',['2ˣ⁺⁴ = f(x + 4) with f(x) = 2ˣ','Inside the function → horizontal','+4 → moves LEFT 4'],'Translation by vector (−4, 0)'),

 Q('What are the asymptotes of y = 3/x + 2?',['x = 0, y = 2','x = 2, y = 0','x = 0, y = 3','x = −2, y = 0'],0,'3/x has asymptotes x = 0, y = 0; +2 moves y = 0 up to y = 2.'),
 S('y = f(x) + k: vertical, vector (0, k).','y = f(x + k): horizontal, vector (−k, 0).','Asymptotes: 1/x → axes; aˣ → y = 0; tan → x = 90°, 270°.','Always give translations as column vectors.')
]);

LS('cg:0','E4.1–E4.3','(x,y)','Three formulas — gradient, length and midpoint — do almost all the work in coordinate geometry.',[
 W('Two points explorer','dist','Drag the coordinates — watch Δx, Δy, length, gradient and midpoint update.'),

  `Positive: ↗ &nbsp; Negative: ↘ &nbsp; Zero: horizontal &nbsp; Undefined: vertical`]),
 EX('All three','A(−2, 5) and B(4, −3). Find the gradient, length and midpoint of AB.',['Δx = 4 − (−2) = 6, Δy = −3 − 5 = −8','Gradient = −8/6 = −4/3','Length = √(6² + 8²) = √100 = 10','Midpoint = ((−2 + 4)/2, (5 − 3)/2) = (1, 1)'],'m = −4/3, AB = 10, M(1, 1)',(()=>{const P=Plot({w:340,h:300,x:[-4,6],y:[-5,7]});P.grid(1,2);P.seg([-2,5],[4,5],{c:'v3',dash:'5 4',w:2,d:.5,s:1});P.seg([4,5],[4,-3],{c:'v4',dash:'5 4',w:2,d:.7});P.seg([-2,5],[4,-3],{c:'v1',w:3,d:.2});P.pt(-2,5,{c:'v1',label:'A(−2, 5)'});P.pt(4,-3,{c:'v1',label:'B(4, −3)',ly:18});P.pt(1,1,{c:'v2',label:'M(1, 1)',lx:30,ly:-4,s:4});return P.svg();})()),
 EX('Finding a missing coordinate','The midpoint of P(3, k) and Q(9, 4) is (6, −1). Find k.',['y: (k + 4)/2 = −1','k + 4 = −2'],'k = −6'),
 MI([['m = (x₂ − x₁)/(y₂ − y₁)','m = (y₂ − y₁)/(x₂ − x₁)','Rise over run — y on top.'],['Length = (Δx + Δy)','√(Δx² + Δy²)','Use Pythagoras.']]),
 Q('What is the gradient of the line through (1, 2) and (3, 10)?',['4','1/4','8','6'],0,'(10 − 2)/(3 − 1) = 8/2 = 4.'),

]);

LS('cg:2','E4.5 · E4.6','∥ ⟂','Parallel lines share a gradient. Perpendicular lines have gradients that multiply to −1. These two facts solve every question here.',[
 FM('The two rules','Parallel: m₁ = m₂ &nbsp;&nbsp;&nbsp; Perpendicular: m₁ × m₂ = −1',[['∥','same gradient, different intercept'],['⟂','flip the fraction and change the sign: 2/3 → −3/2']],null,(()=>{const P=Plot({w:360,h:280,x:[-4,4],y:[-4,4]});P.grid(1,2);P.line(0.5,1,{c:'v1',label:[3.2,3.1,'m = ½']});P.line(0.5,-2,{c:'v1',d:.4,dash:'7 5'});P.line(-2,0.5,{c:'v4',d:.8,label:[-1.6,3.9,'m = −2']});return P.svg({mw:340});})()),
 EX('Parallel [syllabus example]','Find the equation of the line parallel to y = 4x − 1 that passes through (1, −3).',['Parallel → m = 4','−3 = 4(1) + c → c = −7'],'y = 4x − 7'),
 EX('Perpendicular gradient [syllabus example]','Find the gradient of a line perpendicular to 2y = 3x + 1.',['Rearrange: y = 1.5x + 0.5 → m = 3/2','Perpendicular: −1 ÷ 3/2 = −2/3'],'−2/3'),
 EX('Perpendicular bisector [syllabus example]','Find the perpendicular bisector of the line joining (−3, 8) and (9, −2).',['Midpoint: (3, 3)','Gradient: (−2 − 8)/(9 + 3) = −10/12 = −5/6','Perpendicular gradient: 6/5','y − 3 = 6/5 (x − 3) → y = 1.2x − 0.6'],'y = 1.2x − 0.6  (or 6x − 5y = 3)'),
 MI([['Perpendicular to m = 3 → m = −3','m = −1/3','Flip AND change the sign.'],['Perpendicular bisector through an endpoint','Through the MIDPOINT','“Bisector” cuts the segment in half.']]),
 Q('Which line is perpendicular to y = 4x + 1?',['y = −¼x + 3','y = 4x − 2','y = −4x','y = ¼x + 1'],0,'4 × (−¼) = −1.'),
 N('Find the gradient perpendicular to the line through (0, 0) and (2, 6).',-1/3,'m = 3 → perpendicular −1/3.'),

/* ════════════ 5 · GEOMETRY ════════════ */
const quadSVG=(pts,label,c,marks)=>`<div style="display:flex;flex-direction:column;align-items:center">${svgWrap(150,110,pth('M'+pts.map(p=>p.join(' ')).join('L')+'Z',{c,w:2.4,fill:c,fo:.12})+(marks||''),{mw:150})}<b style="font-size:12.5px">${label}</b></div>`;
LS('geo:0','E5.1 · E5.2','△','Geometry has its own language. Using the right word — and three-letter angle notation — is part of giving a full answer.',[
 VS('Special quadrilaterals',`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%">${quadSVG([[20,20],[110,20],[110,100],[20,100]],'Square','var(--v1)')}${quadSVG([[10,30],[140,30],[140,95],[10,95]],'Rectangle','var(--v2)')}${quadSVG([[75,8],[130,55],[75,102],[20,55]],'Rhombus','var(--v3)')}${quadSVG([[35,20],[140,20],[115,95],[10,95]],'Parallelogram','var(--v4)')}${quadSVG([[75,8],[120,40],[75,104],[30,40]],'Kite','var(--v5)')}${quadSVG([[45,20],[105,20],[140,95],[10,95]],'Trapezium','var(--v6)')}</div>`,`<ul class="blist"><li><b>Parallelogram</b>: 2 pairs of parallel sides.</li><li><b>Rhombus</b>: parallelogram with 4 equal sides.</li><li><b>Kite</b>: 2 pairs of ADJACENT equal sides.</li><li><b>Trapezium</b>: exactly 1 pair of parallel sides.</li></ul>`),
 C('Angles & lines',[['Acute','less than 90°'],['Right angle','exactly 90°'],['Obtuse','between 90° and 180°'],['Reflex','between 180° and 360°'],['Parallel / perpendicular','never meet / meet at 90°'],['Perpendicular bisector','cuts a segment in half at 90°'],['Similar','same shape, any size (angles equal)'],['Congruent','identical shape AND size']]),
 C('Triangles, polygons & solids',[['Triangles','equilateral (3 equal), isosceles (2 equal), scalene (none), right-angled'],['Polygons','pentagon 5, hexagon 6, octagon 8, decagon 10; regular = all sides & angles equal'],['Solids','cube, cuboid, prism, cylinder, pyramid, tetrahedron, cone, sphere, hemisphere, frustum'],['Solid parts','face, edge, vertex (corner), surface']]),
 VS('Parts of a circle',ctheorem('parts'),`<ul class="blist"><li><b>Radius</b> centre → edge; <b>diameter</b> = 2 radii.</li><li><b>Chord</b>: line joining two points on the circle.</li><li><b>Tangent</b>: touches at one point.</li><li><b>Arc</b> (part of circumference), <b>sector</b> (pizza slice), <b>segment</b> (cut off by a chord).</li><li>Major/minor arc & sector: bigger/smaller part.</li></ul>`),
 I('Three-letter notation & drawing',[
  `Angle ABC = the angle AT B, between BA and BC (the middle letter is the vertex).`,
  `Use a ruler for every straight line and a sharp pencil.`,
  `Protractor: put the centre on the vertex, zero line along one arm, read from the correct scale.`,
  `Check your reading is sensible: an acute angle can’t be 130°!`]),
 Q('A quadrilateral has exactly one pair of parallel sides. It is a…',['trapezium','parallelogram','kite','rhombus'],0,'Exactly one pair of parallel sides = trapezium.'),
 Q('In angle PQR, which point is the vertex?',['Q','P','R','none'],0,'The middle letter is the vertex.'),
 S('Know the properties of each special quadrilateral.','Acute < 90° < obtuse < 180° < reflex < 360°.','Similar = same shape; congruent = same shape AND size.','Angle ABC is at B.')
]);

LS('geo:1','E5.2','N↻','Bearings give directions as three-figure angles measured clockwise from North — essential for navigation and for trigonometry problems.',[
 I('The three rules',[
  `Measured from <b>North</b>.`,
  `Measured <b>clockwise</b>.`,
  `Always written with <b>three figures</b>: 045°, not 45°.`,
  `“Bearing of B FROM A” → stand at A, face North, turn clockwise to face B.`],compass({b:65,label:'B'}),'Bearing of B from A = 065°'),
 W('Bearings explorer','bearing','Slide the bearing and watch the back bearing.'),
 C('Compass points',[['N','000°'],['NE','045°'],['E','090°'],['SE','135°'],['S','180°'],['SW','225°'],['W','270°'],['NW','315°']]),
 EX('Back bearings [syllabus example]','The bearing of B from A is 025°. Find the bearing of A from B.',['The North lines at A and B are parallel','Back bearing = 025° + 180°'],'205°'),
 EX('Bearings with trigonometry','A ship sails 8 km due East, then 6 km due South. Find its distance and bearing from the start.',['Sketch: 8 km East then 6 km South makes a right-angled triangle','Distance = √(8² + 6²) = 10 km','Angle below the East direction: tan θ = 6/8 → θ = 36.9°','Bearing = 90° + 36.9°'],'10 km on a bearing of 126.9°'),
 MI([['Bearing 45°','045°','Always three figures.'],['Back bearing of 250° = 430°','250° − 180° = 070°','If adding takes you past 360°, subtract instead.']]),
 Q('What is the bearing of South-West?',['225°','135°','315°','045°'],0,'SW is halfway between S (180°) and W (270°).'),
 N('The bearing of P from Q is 310°. Find the bearing of Q from P (just the number).',130,'310 − 180 = 130 → 130°.'),
 S('North, clockwise, three figures.','Back bearing = bearing ± 180°.','Draw a North line at EVERY point.','Bearings + right-angled triangles → Pythagoras & trig.')
]);

LS('geo:2','E5.5','∠','Angle facts are worth easy marks — but only if you state the correct reason for every step.',[
 C('Basic angle facts (with exam wording)',[['Angles at a point','“angles at a point sum to 360°”'],['Straight line','“angles on a straight line sum to 180°”'],['Vertically opposite','“vertically opposite angles are equal”'],['Triangle','“angle sum of a triangle is 180°”'],['Quadrilateral','“angle sum of a quadrilateral is 360°”'],['Exterior angle of triangle','= sum of the two opposite interior angles']]),
 VS('Corresponding angles (F)',parallelAngles({type:'corresponding'}),'Angles in matching positions at each crossing are EQUAL.'),
 VS('Alternate angles (Z)',parallelAngles({type:'alternate'}),'Angles on opposite sides of the transversal, between the parallel lines, are EQUAL.'),
 VS('Co-interior angles (C)',parallelAngles({type:'cointerior'}),'Angles on the same side, between the parallel lines, ADD UP TO 180° (supplementary).'),
 EX('Multi-step with reasons','AB is parallel to CD. A transversal makes angle 65° with AB. An isosceles triangle sits on CD with that angle as a base angle. Find the apex angle.',['Corresponding angle on CD = 65° (corresponding angles are equal)','Isosceles: other base angle = 65° (base angles of an isosceles triangle are equal)','Apex = 180° − 65° − 65° (angle sum of a triangle is 180°)'],'50°'),
 MI([['“Z angles”','“alternate angles are equal”','Use the proper names.'],['Writing only the number','Number + reason for each step','Reasons carry marks.']]),
 Q('Two parallel lines are cut by a transversal. One co-interior angle is 112°. The other is…',['68°','112°','248°','56°'],0,'Co-interior angles sum to 180°.'),
 N('Two angles of a triangle are 47° and 68°. Find the exterior angle at the third vertex.',115,'Exterior angle = 47 + 68 = 115°.'),
 S('Point 360°, line 180°, triangle 180°, quadrilateral 360°.','Corresponding & alternate angles are equal; co-interior sum to 180°.','Vertically opposite angles are equal.','Always give the reason in words.')
]);

LS('geo:3','E5.5.3','⬡','Polygons hide triangles inside them — that one idea gives you every interior and exterior angle formula.',[
 W('Polygon explorer','poly','Change the number of sides: count the triangles and watch the angles.'),
 FM('Polygon formulas (not given)','Interior sum = (n − 2) × 180° &nbsp;&nbsp; Exterior (regular) = 360° ÷ n',[['interior + exterior','= 180° at every vertex'],['sum of exterior angles','= 360° for ANY polygon']]),
 EX('Find the number of sides','Each interior angle of a regular polygon is 156°. How many sides?',['Exterior angle = 180° − 156° = 24°','n = 360° ÷ 24°'],'15 sides'),
 EX('Irregular polygon','A hexagon has angles 100°, 130°, 125°, 140°, 110° and x. Find x.',['Sum = (6 − 2) × 180° = 720°','100 + 130 + 125 + 140 + 110 = 605','x = 720 − 605'],'x = 115°'),
 EX('Can it exist?','Can a regular polygon have interior angles of 130°?',['Exterior angle = 50°','n = 360 ÷ 50 = 7.2 — not a whole number'],'No'),
 MI([['Exterior angle of a hexagon = 360 ÷ 4','360 ÷ 6 = 60°','Divide by the number of sides n.'],['Interior sum of a pentagon = 5 × 180','(5 − 2) × 180 = 540°','n − 2 triangles.']]),
 Q('Interior angle of a regular octagon?',['135°','45°','120°','1080°'],0,'Exterior 360/8 = 45° → interior 135°.'),
 N('Find the sum of the interior angles of a decagon.',1440,'(10 − 2) × 180 = 1440°.'),

]);

LS('geo:4','E5.4','⟲','Symmetry describes how a shape can be reflected or rotated onto itself — in 2D and in 3D solids.',[
 C('Line & rotational symmetry',[['Square','4 lines · order 4'],['Rectangle','2 lines · order 2'],['Rhombus','2 lines · order 2'],['Parallelogram','0 lines · order 2'],['Kite','1 line · order 1'],['Isosceles trapezium','1 line · order 1'],['Equilateral triangle','3 lines · order 3'],['Regular n-gon','n lines · order n']]),
 I('Definitions',[
  `${B('Line symmetry')}: a mirror line splits the shape into two reflections.`,
  `${B('Order of rotational symmetry')}: how many times the shape looks the same in one full turn (order 1 = no rotational symmetry).`,
  `Use tracing paper in the exam — you can ask for it!`],polygonSVG(6),'A regular hexagon: 6 lines, order 6'),
 C('3D symmetry [Extended]',[['Plane of symmetry','a flat cut that splits a solid into two mirror halves'],['Axis of symmetry','a line the solid can rotate around and look the same'],['Cuboid (not cube)','3 planes of symmetry'],['Cube','9 planes of symmetry'],['Cylinder / cone','infinitely many planes through the axis; rotational axis down the centre'],['Square-based pyramid','4 planes; axis of order 4 through the apex']]),
 Q('How many lines of symmetry does a parallelogram (not a rhombus or rectangle) have?',['0','1','2','4'],0,'It has rotational symmetry of order 2 but no lines of symmetry.'),
 N('What is the order of rotational symmetry of a regular pentagon?',5,'Regular n-gon → order n.'),
 S('Line symmetry = mirror lines; rotational order = matches per full turn.','Regular n-gon: n lines, order n.','Planes and axes of symmetry for 3D solids.','Ask for tracing paper to check.')
]);

LS('geo:5','E5.3','k','Similar shapes are enlargements of each other. The scale factor k works for lengths — but areas use k² and volumes use k³.',[
 W('Scale factor explorer','similar','Change k: lengths ×k, areas ×k², volumes ×k³.'),
 FM('The similarity rules','Length × k &nbsp;&nbsp; Area × k² &nbsp;&nbsp; Volume × k³',[['k','= new length ÷ old length (corresponding sides)'],['area → k','square root the area factor'],['volume → k','cube root the volume factor']]),
 EX('Lengths','Triangles ABC and PQR are similar. AB = 6 cm, PQ = 9 cm, BC = 8 cm. Find QR.',['k = 9 ÷ 6 = 1.5','QR = 8 × 1.5'],'12 cm'),
 EX('Volume from lengths','Two similar jugs are 12 cm and 18 cm tall. The small jug holds 400 ml. How much does the large jug hold?',['k = 18 ÷ 12 = 1.5','Volume factor = 1.5³ = 3.375','400 × 3.375'],'1350 ml'),
 EX('Length from area [Extended]','Two similar shapes have areas 25 cm² and 64 cm². The smaller has perimeter 20 cm. Find the larger perimeter.',['Area factor = 64/25 → k = √(64/25) = 8/5','Perimeter is a length → × 8/5','20 × 1.6'],'32 cm'),
 I('Proving triangles are similar [Extended]',[
  `Show two pairs of angles are equal (then the third must be too).`,
  `Give geometric reasons: “vertically opposite”, “alternate angles”, “common angle”.`,
  `Then match corresponding sides carefully — opposite equal angles.`]),
 MI([['Area of a shape 3× as long is 3× bigger','9× bigger','Areas scale by k².'],['k from areas 4 and 36 = 9','k = √9 = 3','The area factor is k², not k.']]),
 Q('Two similar cylinders have radii 2 cm and 6 cm. The ratio of their volumes is…',['1 : 27','1 : 9','1 : 3','1 : 6'],0,'k = 3, volume factor 3³ = 27.'),
 N('Similar shapes: small area 12 cm², scale factor 2.5. Find the large area.',75,'12 × 2.5² = 75.'),
 S('Find k from a pair of corresponding lengths.','Areas × k², volumes × k³.','Going backwards: √ for area, ∛ for volume.','Similar triangles: equal angles, with reasons.')

LS('geo:6','E5.6 · E5.7','○','The first three circle theorems — all about right angles and tangents. Learn the diagram AND the exact wording.',[
 VS('Angle in a semicircle',ctheorem('semicircle'),`<ul class="blist"><li>The angle in a semicircle is a <b>right angle</b>.</li><li>Trigger: a triangle drawn on a <b>diameter</b>.</li><li>Reason to write: “angle in a semicircle = 90°”.</li></ul>`),
 VS('Tangent and radius',ctheorem('tangent'),`<ul class="blist"><li>A tangent is <b>perpendicular</b> to the radius at the point of contact.</li><li>Trigger: a radius drawn to where a tangent touches.</li><li>Reason: “the angle between a tangent and a radius is 90°”.</li></ul>`),
 VS('Two tangents from a point',ctheorem('twotangents'),`<ul class="blist"><li>Tangents from an external point are <b>equal in length</b>.</li><li>So triangle PAB is isosceles, and the kite OAPB is symmetric.</li><li>Reason: “tangents from an external point are equal”.</li></ul>`),
 EX('Using two theorems','PA and PB are tangents from P to a circle, centre O. Angle APB = 50°. Find angle AOB.',['OAP = OBP = 90° (tangent ⟂ radius)','OAPB is a quadrilateral: angles sum to 360°','AOB = 360° − 90° − 90° − 50°'],'130°'),
 EX('Semicircle + triangle sum','AB is a diameter, C is on the circle, angle CAB = 34°. Find angle ABC.',['ACB = 90° (angle in a semicircle)','ABC = 180° − 90° − 34°'],'56°'),
 MI([['Writing just “90°”','“angle in a semicircle is 90°”','No reason → no mark.'],['Assuming a line through the centre without being told','Only diameters give the semicircle theorem','Check the line really passes through O.']]),
 Q('A tangent at T meets radius OT. The angle between them is…',['90°','180°','45°','depends on the circle'],0,'Tangent ⟂ radius.'),
 N('Angle in a semicircle: the other two angles of the triangle are x and 2x. Find x.',30,'x + 2x = 90 → x = 30.'),
 S('Angle in a semicircle = 90°.','Tangent ⟂ radius.','Tangents from an external point are equal.','Always write the theorem as your reason.')
]);

LS('geo:7','E5.6 · E5.7','⊙','Five more circle theorems for Extended — angles from arcs, cyclic quadrilaterals, the alternate segment, and chord symmetry.',[
 W('Angle at the centre — live','centre','Move C around the circle: the angle at C stays the same and is always half the angle at the centre.'),
 VS('Angle at the centre',ctheorem('centre'),`<ul class="blist"><li>The angle at the centre is <b>twice</b> the angle at the circumference (standing on the same arc).</li><li>Look for an “arrowhead” shape from the arc.</li></ul>`),
 VS('Angles in the same segment',ctheorem('samesegment'),`<ul class="blist"><li>Angles subtended by the same arc, in the same segment, are <b>equal</b>.</li><li>Look for a “bow-tie” shape.</li></ul>`),
 VS('Cyclic quadrilateral',ctheorem('cyclic'),`<ul class="blist"><li>All four vertices on the circle.</li><li><b>Opposite angles sum to 180°</b>.</li></ul>`),
 VS('Alternate segment theorem',ctheorem('altseg'),`<ul class="blist"><li>The angle between a tangent and a chord equals the angle in the <b>alternate segment</b>.</li><li>Trigger: a tangent AND a chord from the same point.</li></ul>`),
 VS('Chord symmetry (Circle theorems II)',ctheorem('chord'),`<ul class="blist"><li>The perpendicular from the centre to a chord <b>bisects</b> it.</li><li>The <b>perpendicular bisector of a chord passes through the centre</b>.</li><li><b>Equal chords are equidistant</b> from the centre.</li><li>Often combined with Pythagoras!</li></ul>`),
 EX('Combining theorems','O is the centre. Angle AOB = 130°. C is on the major arc and ACBD is a cyclic quadrilateral. Find angles ACB and ADB.',['ACB = 130° ÷ 2 = 65° (angle at centre = 2 × angle at circumference)','ADB = 180° − 65° = 115° (opposite angles of a cyclic quadrilateral)'],'ACB = 65°, ADB = 115°'),
 MI([['Angle at circumference = 2 × centre','Centre = 2 × circumference','The centre angle is the BIG one.'],['Cyclic quad: adjacent angles add to 180°','OPPOSITE angles add to 180°','Pair angles across the shape.'],['Any 4-sided shape in a circle is cyclic','All 4 vertices must lie ON the circle','Check the vertices.']]),
 Q('Angle at the centre is 2x + 20°; angle at the circumference on the same arc is 50°. Find x.',['40','15','30','60'],0,'2x + 20 = 100 → x = 40.'),
 N('ABCD is cyclic. Angle A = 3y and angle C = 2y. Find y.',36,'Opposite angles: 5y = 180 → y = 36.'),
 S('Centre = 2 × circumference.','Same segment → equal angles.','Cyclic quadrilateral: opposite angles sum to 180°.','Alternate segment: tangent–chord angle = angle in the opposite segment.','Perpendicular from the centre bisects a chord; equal chords are equidistant.')
]);

const sqGrid=(n,lab,c)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><svg viewBox="0 0 120 120" class="viz" style="max-width:130px">${[...Array(n*n)].map((_,i)=>`<rect x="${10+(i%n)*100/n}" y="${10+Math.floor(i/n)*100/n}" width="${100/n}" height="${100/n}" class="pop" style="--d:${i*.012}s;fill:${c};fill-opacity:.25;stroke:${c};stroke-width:.6"/>`).join('')}</svg><b style="font-size:12.5px">${lab}</b></div>`;
LS('men:0','E6.1','m³','Converting units is easy for lengths — but areas and volumes use squared and cubed conversion factors. That’s where marks are lost.',[
 C('Metric units',[['Length','10 mm = 1 cm · 100 cm = 1 m · 1000 m = 1 km'],['Mass','1000 g = 1 kg'],['Capacity','1000 ml = 1 litre'],['Volume ↔ capacity','1 cm³ = 1 ml · 1000 cm³ = 1 litre · 1 m³ = 1000 litres']]),
 VS('Why areas use ×100, not ×10',`<div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap">${sqGrid(1,'1 cm × 1 cm = 1 cm²','var(--v1)')}${sqGrid(10,'10 mm × 10 mm = 100 mm²','var(--v2)')}</div>`,`<ul class="blist"><li>1 cm = 10 mm, so 1 cm² = 10 × 10 = <b>100 mm²</b>.</li><li>1 m = 100 cm, so 1 m² = <b>10 000 cm²</b>.</li><li>Volumes: 1 m³ = 100³ = <b>1 000 000 cm³</b>.</li><li>Rule: square the length factor for area, cube it for volume.</li></ul>`),

 EX('Area conversion','Convert 3.5 m² into cm².',['1 m² = 10 000 cm²','3.5 × 10 000'],'35 000 cm²'),
 EX('Volume to capacity','A tank measures 1.2 m × 80 cm × 50 cm. How many litres does it hold?',['Same units first: 120 cm × 80 cm × 50 cm','Volume = 480 000 cm³','÷ 1000 → litres'],'480 litres'),

function dualBars(cats,A,B,keys){const W=420,H=240,pad=34,max=Math.max(...A,...B)*1.2,bw=(W-pad-20)/cats.length;let s=`<line x1="${pad}" y1="${H-pad}" x2="${W-8}" y2="${H-pad}" style="stroke:var(--v-axis);stroke-width:1.6"/><line x1="${pad}" y1="12" x2="${pad}" y2="${H-pad}" style="stroke:var(--v-axis);stroke-width:1.6"/>`;
  for(let y=4;y<max;y+=4){const yy=H-pad-(y/max)*(H-pad-14);s+=`<line x1="${pad}" y1="${yy}" x2="${W-8}" y2="${yy}" style="stroke:var(--v-grid)"/>`+txt(pad-6,yy,y,{a:'end',c:'mut',s:10.5,w:500});}
  cats.forEach((c,i)=>{const x=pad+10+i*bw;[A[i],B[i]].forEach((v,j)=>{const h=v/max*(H-pad-14),xx=x+j*(bw/2-6);s+=`<rect x="${xx}" y="${H-pad-h}" width="${bw/2-10}" height="${h}" rx="3" class="grow" style="--d:${.12*i+.06*j}s;fill:var(--v${j+1});transform-origin:${xx}px ${H-pad}px"/>`;});s+=txt(x+bw/2-10,H-pad+13,c,{c:'mut',s:11,w:600});
    const sx=W-150+i*0;});
  // stacked mini version on the right? keep key only
  s+=`<rect x="${W-130}" y="14" width="11" height="11" rx="2" style="fill:var(--v1)"/>`+txt(W-114,20,keys[0],{a:'start',s:11.5,w:600})+`<rect x="${W-130}" y="32" width="11" height="11" rx="2" style="fill:var(--v2)"/>`+txt(W-114,38,keys[1],{a:'start',s:11.5,w:600});
  return svgWrap(W,H,s,{mw:430});}

/* ════════════════════════════════════════════════════════════
   QUESTION GENERATORS — one per checklist subtopic (topic:section)
   Each returns {q, ans, a?, steps, calc, marks, mc?, hint?}
   ans: number | {set:[..]} | {pair:[x,y]} | {txt:[..]} | {expr,v} | {ratio:[..]}
   mc: [correct, wrong1, wrong2, wrong3]  (shuffled by the engine)
════════════════════════════════════════════════════════════ */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
function fr(n,d){if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?String(n):n+'/'+d;}
function frH(n,d){if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?String(n).replace('-','−'):(n<0?'−':'')+F(Math.abs(n),d);}
const sf3=x=>{if(x===0)return'0';const r=Number(x.toPrecision(3));return Math.abs(r)>=1000?String(Math.round(r)):String(r);};
const m=n=>String(n).replace('-','−');
const term=(c,v,first)=>{if(c===0)return'';const s=c<0?'−':'+';const a=Math.abs(c);const body=(a===1&&v?'':a)+v;return first?(c<0?'−':'')+body:` ${s} ${body}`;};
const poly=(cs,v='x')=>{const n=cs.length-1;let out='';cs.forEach((c,i)=>{const p=n-i;const vv=p===0?'':p===1?v:v+sup(p);const t=term(c,vv,out==='');out+=t;});return out||'0';};
const lin=(a,b,v='x')=>poly([a,b],v);
function primeFactors(n){const f={};let x=n;for(let p=2;p*p<=x;p++)while(x%p===0){f[p]=(f[p]||0)+1;x/=p;}if(x>1)f[x]=(f[x]||0)+1;return f;}
const pfStr=f=>Object.keys(f).map(p=>p+(f[p]>1?sup(f[p]):'')).join(' × ');
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};
const surd=(n)=>{let o=1,i=n;for(let k=Math.floor(Math.sqrt(n));k>1;k--)if(n%(k*k)===0){o=k;i=n/(k*k);break;}return[o,i];};
const sq=(o,i)=>i===1?String(o):(o===1?'':o)+'√'+i;
const deg2=x=>Math.round(x*10)/10;

  const P=[...Array(n)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6+3,c:PAL[Math.floor(Math.random()*PAL.length)],a:Math.random()*6,s:Math.random()*.3-.15}));
  let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-t/110);x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});if(++t<115)requestAnimationFrame(f);else c.remove();})();}

const SUPMAP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};
function normSup(s){return s.replace(/[⁻]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.split('').map(c=>SUPMAP[c]).join(''));}
function parseNum(s0){
  let s=normSup(String(s0)).trim().toLowerCase().replace(/[−–]/g,'-').replace(/(\d),(\d{3})/g,'$1$2').replace(/\s+/g,'').replace(/[$£€%°]/g,'');
  s=s.replace(/(cm|mm|km|kg|ml|m\/s|km\/h|litres?|l|m|g|s|h|mins?|units?|degrees?|years?)(\^?[23])?$/,'');
  s=s.replace(/×/g,'x').replace(/\*/g,'x');
  let m=s.match(/^(-?[\d.]+)x10\^\(?(-?\d+)\)?$/);if(m)return +m[1]*10**+m[2];
  m=s.match(/^(-?[\d.]+)e(-?\d+)$/);if(m)return +m[1]*10**+m[2];
  if(/π|pi/.test(s)){s=s.replace('pi','π');const [a,b]=s.split('π');let k=a===''?1:a==='-'?-1:parseFrac(a);let d=b&&b.startsWith('/')?parseFrac(b.slice(1)):1;return k*Math.PI/d;}
  return parseFrac(s);
}
function parseFrac(s){let m=String(s).match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m)return +m[1]/+m[2];if(/^-?\d*\.?\d+$/.test(s))return +s;return NaN;}
function close3(u,a){if(!isFinite(u))return false;if(Math.abs(u-a)<=1e-9*Math.max(1,Math.abs(a)))return true;if(a===0)return Math.abs(u)<5e-4;const tol=0.5*10**(Math.floor(Math.log10(Math.abs(a)))-2);return Math.abs(u-a)<=tol*1.0001;}
function normTxt(s){return normSup(String(s)).toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/sqrt\(?([0-9]+)\)?/g,'√$1').replace(/\*/g,'').replace(/×/g,'x').replace(/·/g,'');}
function exprFn(s,v){
  let e=normSup(String(s)).toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/');
  e=e.replace(/^[a-z]\(?[a-z]?\)?=/,'').replace(/^t\(?n\)?=|^tn=|^y=/,'');
  if(!new RegExp('^[0-9.+\\-*/^()'+v+']+$').test(e))return null;
  e=e.replace(new RegExp('(\\d|\\))(?=['+v+'(])','g'),'$1*').replace(new RegExp('(['+v+'])(?=[\\d'+v+'(])','g'),'$1*').replace(/\^/g,'**');
  try{return new Function(v,'return '+e);}catch(err){return null;}
}
function checkAns(input,ans){
  if(input==null||String(input).trim()==='')return false;
  if(typeof ans==='number')return close3(parseNum(input),ans);
  if(Array.isArray(ans))return ans.some(a=>checkAns(input,a));
  if(ans.txt)return ans.txt.some(t=>normTxt(t)===normTxt(input));
  if(ans.set){const nums=String(input).replace(/[−–]/g,'-').split(/[,;]|\band\b|\bor\b/).map(x=>parseNum(x.replace(/^[a-z]+=/i,''))).filter(x=>isFinite(x));if(nums.length!==ans.set.length)return false;const used=new Set();return ans.set.every(a=>{const j=nums.findIndex((u,k)=>!used.has(k)&&close3(u,a));if(j<0)return false;used.add(j);return true;});}
  if(ans.pair){const nums=String(input).replace(/[−–]/g,'-').replace(/[()\[\]]/g,'').split(/[,;]/).map(x=>parseNum(x.replace(/^[a-z]+=/i,'')));return nums.length===2&&close3(nums[0],ans.pair[0])&&close3(nums[1],ans.pair[1]);}
  if(ans.expr){const v=ans.v||'x';const f=exprFn(input,v),g=exprFn(ans.expr,v);if(!f||!g)return false;try{const pts=[1.37,2.71,-0.83,3.29,0.51,-2.6,5.13].filter(t=>isFinite(g(t)));return pts.length>=4&&pts.every(t=>Math.abs(f(t)-g(t))<1e-6*Math.max(1,Math.abs(g(t))));}catch(e){return false;}}

}
function ansText(a){if(a==null)return'';if(typeof a==='number')return fmtNum(a);if(Array.isArray(a))return ansText(a[0]);if(a.txt)return a.txt[0];if(a.set)return a.set.map(fmtNum).join(', ');if(a.pair)return'('+a.pair.map(fmtNum).join(', ')+')';if(a.expr)return a.show||a.expr;if(a.ratio)return a.ratio.join(' : ');return'';}
function fmtNum(n){if(!isFinite(n))return String(n);if(Number.isInteger(n))return String(n).replace('-','−');const s=Math.abs(n)>=1000?n.toFixed(1):Number(n.toPrecision(Math.abs(n)<1?3:4)).toString();return s.replace('-','−');}

let PQ=null,pStreak=0,pSession={c:0,n:0};
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function makeQ(key,seed){const g=GEN[key];if(!g)return null;const r=R(seed);let q;for(let t=0;t<20;t++){try{q=g(r);if(q)break;}catch(e){console.error(key,e);}}if(!q)return null;q.key=key;q.seed=seed;
  if(q.mc){q.mc=q.mc.filter((o,i)=>q.mc.indexOf(o)===i);const opts=r.shuffle(q.mc.map((o,i)=>({o,ok:i===0})));q.opts=opts.map(x=>x.o);q.correct=opts.findIndex(x=>x.ok);}
  return q;}

const GP={fns:['x^2 - 3','2x + 1','',''],show:[1,1,1,1],x:[-6,6],y:[-6,8],deg:true};
const GCOL=['var(--v1)','var(--v2)','var(--v3)','var(--v4)'];
function compileFn(src,deg){
  let s=String(src).toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3').replace(/^y=|^f\(x\)=/,'');
  if(!s)return null;if(!/^[0-9a-z.+\-*/^(),]+$/.test(s))throw new Error('Use only numbers, x, + − × ÷ ^ ( ) and sin cos tan sqrt log ln abs pi e');
  const toks=s.match(/\d*\.?\d+|[a-z]+|[+\-*/^(),]/g)||[];const FN=['sin','cos','tan','asin','acos','atan','sqrt','log','ln','abs','exp'];const out=[];
  const isVal=t=>t&&(/^[\d.]/.test(t)||t==='x'||t==='pi'||t==='e'||t===')');
  toks.forEach(t=>{
    if(/^[a-z]+$/.test(t)&&!['x','pi','e',...FN].includes(t)){const parts=[];let r=t;while(r.length){const f=['asin','acos','atan','sqrt','sin','cos','tan','log','abs','exp','ln','pi','x','e'].find(n=>r.startsWith(n));if(!f)throw new Error('Unknown word “'+t+'”');parts.push(f);r=r.slice(f.length);}parts.forEach(p=>{if(isVal(out[out.length-1])&&(isVal(p)||FN.includes(p)))out.push('*');out.push(p);});return;}
    if(isVal(out[out.length-1])&&(isVal(t)&&t!==')'||FN.includes(t)||t==='('))out.push('*');out.push(t);});
  const js=out.map(t=>t==='^'?'**':t==='pi'?'Math.PI':t==='e'?'Math.E':FN.includes(t)?'S.'+t:t).join('');
  const k=deg?Math.PI/180:1;const S={sin:v=>Math.sin(v*k),cos:v=>Math.cos(v*k),tan:v=>Math.tan(v*k),asin:v=>Math.asin(v)/k,acos:v=>Math.acos(v)/k,atan:v=>Math.atan(v)/k,sqrt:Math.sqrt,log:Math.log10,ln:Math.log,abs:Math.abs,exp:Math.exp};
  const f=new Function('x','S','return '+js);f(1.234,S);return x=>f(x,S);
}
function gpRoots(f,a,b){const out=[];const n=600;let px=a,py=f(a);for(let i=1;i<=n;i++){const x=a+(b-a)*i/n,y=f(x);if(isFinite(py)&&isFinite(y)&&py*y<=0&&Math.abs(y-py)<(GP.y[1]-GP.y[0])){let lo=px,hi=x;for(let k=0;k<50;k++){const m=(lo+hi)/2;if(f(lo)*f(m)<=0)hi=m;else lo=m;}const r=(lo+hi)/2;if(!out.some(o=>Math.abs(o-r)<(b-a)/400))out.push(r);}px=x;py=y;}return out;}
function gpTurns(f,a,b){const out=[];const h=(b-a)/2000,d=x=>(f(x+h)-f(x-h))/(2*h);const n=400,o=0.3719;let px=a,pd=d(a+(b-a)*o/n);for(let i=1;i<=n;i++){const x=a+(b-a)*(i+o)/n,dd=d(x);if(x>b)break;if(isFinite(pd)&&isFinite(dd)&&pd*dd<0){let lo=px,hi=x;for(let k=0;k<40;k++){const m=(lo+hi)/2;if(d(lo)*d(m)<=0)hi=m;else lo=m;}const r=(lo+hi)/2,y=f(r);if(isFinite(y)&&Math.abs(y)<1e6)out.push([r,y,pd>0?'max':'min']);}px=x;pd=dd;}return out;}

function searchRun(q,lim){q=q.trim().toLowerCase();if(!q)return[];const toks=q.split(/\s+/);const res=[];
  searchIndex().forEach(it=>{const t=it.t.toLowerCase(),hay=t+' '+(it.s||'').toLowerCase();let sc=0;if(toks.every(k=>hay.includes(k)))sc=it.w*10+(t.startsWith(q)?20:0)+(t.includes(q)?10:0);else if(it.x&&toks.every(k=>(hay+' '+it.x).includes(k)))sc=it.w*3;if(sc)res.push([sc,it]);});
  return res.sort((a,b)=>b[0]-a[0]).slice(0,lim||80).map(r=>r[1]);}
function pageSearch(el){const q=decodeURIComponent(route.slice(1).join('/')||'');const res=searchRun(q,100);
  el.innerHTML=`<div class="ph"><div><h1>Search: “${esc(q)}”</h1><p>${res.length} result${res.length===1?'':'s'} across lessons, practice, notes, formulas and the checklist</p></div></div>${res.map(r=>`<div class="card sr" onclick="${r.fn?'':`go('${r.h}')`}">${ico(r.ic,'neon')}<div><b>${hl(r.t,q)}</b><span>${r.k} · ${esc(r.s)}</span></div></div>`).join('')||`<div class="empty">No results — try “quadratic”, “sine rule”, “median”, “vector”…</div>`}`;}

function palRender(q){palSel=0;palRes=q.trim()?searchRun(q,12):searchIndex().filter(x=>x.k==='Page'||x.k==='Action').slice(0,12);
  const L=document.getElementById('pal-list');L.innerHTML=palRes.map((r,i)=>`<div class="pal-it${i===0?' on':''}" onmousemove="palHover(${i})" onclick="palGo(${i})">${ico(r.ic,'neon')}<div><b>${hl(r.t,q.trim())}</b><span>${esc(r.s||'')}</span></div><em>${r.k}</em></div>`).join('')||`<div class="pal-empty">No matches — press Enter to search everything</div>`;}

function palKey(e){if(e.key==='Escape'){closePalette();return;}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();palSel=(palSel+(e.key==='ArrowDown'?1:-1)+palRes.length)%Math.max(1,palRes.length);palHover(palSel);const it=document.querySelectorAll('.pal-it')[palSel];if(it)it.scrollIntoView({block:'nearest'});}if(e.key==='Enter'){e.preventDefault();palGo(palSel);}}

async function packProgress(){writeNow();savePrefs();const d={};Object.keys(localStorage).filter(k=>k.startsWith('igcse0607_')&&!k.endsWith('_backup')).forEach(k=>d[k]=localStorage.getItem(k));
  let bytes=new TextEncoder().encode(JSON.stringify(d)),tag='j';
  if(window.CompressionStream){try{const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(cs).arrayBuffer());tag='z';}catch(e){}}
  let b='';for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return tag+btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function unpackProgress(code){code=String(code).trim().replace(/^.*#import=/,'').replace(/\s+/g,'');const tag=code[0];let s=code.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
  let bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(tag==='z'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer());}else if(tag!=='j')throw new Error('bad code');
  const d=JSON.parse(new TextDecoder().decode(bytes));if(!d||typeof d!=='object'||!Object.keys(d).every(k=>k.startsWith('igcse0607_')))throw new Error('bad data');return d;}

<div class="tr-step"><b>1</b><div><span>Website address</span><input id="tr-url" placeholder="https://your-name.github.io/igcse-0607-hub/" value="${esc(base)}" oninput="prefs.siteUrl=this.value.trim();savePrefs()"></div></div>
<div class="qactions" style="margin-top:6px"><button class="btn pri" onclick="trCopy('link')">${ico('link')}Copy transfer link</button>${navigator.share?`<button class="btn" onclick="trShare()">${ico('external')}Share…</button>`:''}<button class="btn" onclick="trCopy('code')">${ico('grid')}Copy code only</button></div>
<p class="muted" style="margin-top:8px">Open the link on the other device (or paste the code there via Menu → Transfer → “Paste a code”). Size: ${code.length<1024?'under 1':Math.round(code.length/1024)} KB.</p>

if(window.matchMedia&&matchMedia('(pointer:fine)').matches){document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.tile,.ach,.tcard,.stat,.ready a');if(!c||RM)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg) translateY(-3px)`;},{passive:true});document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.tile,.ach,.tcard,.stat,.ready a');if(c&&!c.contains(e.relatedTarget))c.style.transform='';});}
{const sp=document.createElement('div');sp.className='scrollbar-p';document.body.appendChild(sp);addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;sp.style.transform=`scaleX(${h>0?scrollY/h:0})`;},{passive:true});}

</script>
